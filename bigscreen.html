<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考场 · 任务大屏 · XxPuan's Value</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,500;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <style>
    @font-face { font-family:'HarmonyOS Sans'; src:url('assets/fonts/HarmonyOS_Sans_Regular.woff2') format('woff2'); font-weight:400; font-display:swap; }
    @font-face { font-family:'HarmonyOS Sans'; src:url('assets/fonts/HarmonyOS_Sans_Medium.woff2') format('woff2'); font-weight:500; font-display:swap; }
    @font-face { font-family:'HarmonyOS Sans'; src:url('assets/fonts/HarmonyOS_Sans_Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }
    @font-face { font-family:'HarmonyOS Sans'; src:url('assets/fonts/HarmonyOS_Sans_Black.woff2') format('woff2'); font-weight:800; font-display:swap; }

    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#08080E;
      --neon:#00E5FF;          /* 荧光青 —— 主视觉/倒计时 */
      --neon-dim:rgba(0,229,255,.5);
      --purple:#A855F7;--purple-deep:#7C3AED;
      --warn:#FF3B5C;          /* 告警红 */
      --ok:#34d399;            /* 已完成绿 */
      --amber:#FFC857;         /* 未开始琥珀 */
      --t-hi:#FFFFFF;
      --t-mid:rgba(255,255,255,.84);
      --t-low:rgba(255,255,255,.66);
      --t-dim:rgba(255,255,255,.5);
      --line:rgba(255,255,255,.12);
      --glass:rgba(255,255,255,.05);
      --glass-br:rgba(255,255,255,.1);
    }
    html{font-family:'HarmonyOS Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t-hi);-webkit-font-smoothing:antialiased;overflow:hidden}
    body{height:100vh;height:100dvh;overflow:hidden;background:transparent}
    a{color:inherit;text-decoration:none}

    /* ===== 独立背景：深紫渐变 + 网格 + 多层荧光光晕 ===== */
    #bgImg{
      position:fixed;inset:0;z-index:0;
      background:
        radial-gradient(1100px 600px at 82% -10%, rgba(0,229,255,.10), transparent 60%),
        radial-gradient(1000px 620px at -12% 108%, rgba(168,85,247,.16), transparent 60%),
        linear-gradient(160deg,#0c0b18 0%,#08080e 55%,#0a0e1c 100%);
    }
    #bgImg::after{
      content:'';position:absolute;inset:0;pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
      background-size:64px 64px;
      mask-image:radial-gradient(ellipse at 50% 32%, #000 30%, transparent 78%);
      -webkit-mask-image:radial-gradient(ellipse at 50% 32%, #000 30%, transparent 78%);
    }
    /* 静态多层光晕 */
    body::before{
      content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
      background:
        radial-gradient(ellipse 720px 720px at 14% 22%, rgba(124,58,237,.30), transparent 65%),
        radial-gradient(ellipse 640px 640px at 82% 14%, rgba(0,229,255,.20), transparent 65%),
        radial-gradient(ellipse 860px 860px at 50% 88%, rgba(59,91,246,.20), transparent 65%),
        radial-gradient(ellipse 480px 480px at 90% 70%, rgba(0,229,255,.10), transparent 60%);
    }
    /* 缓慢漂移光斑 */
    body::after{
      content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
      background:
        radial-gradient(ellipse 420px 420px at 60% 36%, rgba(0,229,255,.12), transparent 60%),
        radial-gradient(ellipse 460px 460px at 26% 68%, rgba(124,58,237,.14), transparent 60%),
        radial-gradient(ellipse 380px 380px at 78% 56%, rgba(99,102,241,.10), transparent 60%);
      animation:drifting 14s ease-in-out infinite alternate;
    }
    @keyframes drifting{
      0%{transform:translate(0,0) scale(1)}
      33%{transform:translate(20px,-14px) scale(1.05)}
      50%{transform:translate(-14px,20px) scale(.97)}
      100%{transform:translate(14px,-8px) scale(1.03)}
    }

    /* ===== 玻璃页眉（液态玻璃，与主页/状态页同款） ===== */
    .gs{
      position:fixed;top:20px;left:50%;transform:translateX(-50%);
      z-index:100;
      width:min(92vw,1320px);
      height:60px;
      border-radius:50px;
      display:flex;align-items:center;
      padding:0 24px;
      overflow:hidden;
    }
    .gs--svg{
      background:hsl(0 0% 0% / 0);
      backdrop-filter:var(--gs-filter) saturate(1.3);
      -webkit-backdrop-filter:var(--gs-filter) saturate(1.3);
      box-shadow:
        0 0 1.5px 1px rgba(255,255,255,.15) inset,
        0 0 10px 4px rgba(255,255,255,.07) inset,
        0 4px 16px rgba(17,17,26,.06),
        0 8px 24px rgba(17,17,26,.05),
        0 16px 56px rgba(17,17,26,.05);
    }
    .gs--fallback{
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(18px) saturate(1.8) brightness(1.15);
      -webkit-backdrop-filter:blur(18px) saturate(1.8) brightness(1.15);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 8px 32px rgba(31,38,135,.15),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(255,255,255,.12);
    }
    .gs__svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;z-index:-1}
    .gs__content{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:center;justify-content:space-between;border-radius:inherit;padding:0 4px}
    .gs__title{display:flex;align-items:center;gap:5px;flex-shrink:0}
    .gs__title b{font-size:21px;font-weight:800;color:#fff}
    .gs__title .s{font-size:15px;font-weight:500;color:var(--t-mid);letter-spacing:.01em}
    .gs__clock{
      margin-left:18px;flex-shrink:0;
      font-family:'Bebas Neue','HarmonyOS Sans',sans-serif;
      font-size:26px;font-weight:400;letter-spacing:.06em;color:var(--neon);
      text-shadow:0 0 14px rgba(0,229,255,.55);
      font-variant-numeric:tabular-nums;
    }
    .gs__nav{display:flex;align-items:center;gap:clamp(8px,1.2vw,18px);margin-left:auto}
    .gs__nav-item{
      font-size:clamp(0.65rem,.9vw,0.85rem);
      font-weight:700;color:var(--t-hi);letter-spacing:.04em;
      cursor:pointer;transition:opacity .25s ease;text-decoration:none;
    }
    .gs__nav-item:hover{opacity:.65}
    .gs__nav-item.active{color:var(--neon);text-shadow:0 0 14px rgba(0,229,255,.7)}

    /* ===== 内容区 ===== */
    .page-wrap{
      position:relative;z-index:3;
      height:100vh;height:100dvh;overflow:hidden;
      padding:clamp(86px,9vh,98px) clamp(16px,2.6vw,40px) clamp(14px,2vh,20px);
      max-width:1560px;margin:0 auto;
      display:flex;flex-direction:column;gap:clamp(8px,1.4vh,16px);
    }

    /* ===== 顶部信息条：大时钟 + 日期 + 场次概览 ===== */
    .info-strip{
      flex-shrink:0;
      display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:nowrap;
      padding:0 6px;
    }
    .info-date{
      font-family:'Noto Serif SC',Georgia,serif;
      font-size:clamp(0.8rem,2.1vh,1.35rem);font-weight:700;color:var(--t-mid);letter-spacing:.1em;
    }
    .info-date .wk{color:var(--neon);text-shadow:0 0 12px rgba(0,229,255,.5);margin-left:8px}
    .info-summary{
      font-size:clamp(0.68rem,2vh,0.95rem);color:var(--t-low);letter-spacing:.08em;
    }
    .info-summary b{color:var(--neon);font-weight:700;text-shadow:0 0 10px rgba(0,229,255,.45)}

    /* ===== 主网格：左英雄区 + 右栏 ===== */
    .screen-grid{
      flex:1;display:grid;grid-template-columns:1.72fr 1fr;gap:clamp(10px,1.6vh,20px);
      min-height:0;align-items:stretch;overflow:hidden;
    }

    /* ---------- 玻璃卡片通用 ---------- */
    .glass-card{
      position:relative;border-radius:24px;
      background:var(--glass);
      backdrop-filter:blur(26px) saturate(1.15);
      -webkit-backdrop-filter:blur(26px) saturate(1.15);
      border:1px solid var(--glass-br);
      box-shadow:0 8px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
      overflow:hidden;
    }
    .glass-card::before{
      content:'';position:absolute;top:-45%;right:-15%;width:60%;height:90%;
      background:radial-gradient(ellipse,rgba(124,58,237,.12),transparent 70%);pointer-events:none;
    }

    /* ---------- 左：当前阶段英雄区 ---------- */
    .hero{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;gap:clamp(6px,1.2vh,14px);
      padding:clamp(10px,1.8vh,24px) clamp(12px,1.8vw,24px);
      /* ElectricBorder 需要 visible 溢出 */
      overflow:visible;min-height:0;
    }
    .hero .inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:inherit}

    .badge{
      font-size:clamp(0.68rem,1.9vh,1.15rem);font-weight:700;letter-spacing:.28em;
      padding:.45em 1.6em;border-radius:999px;
      display:inline-flex;align-items:center;gap:.6em;
    }
    .badge .pulse{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:blink 1.2s step-end infinite}
    .badge.live{color:var(--neon);border:1px solid rgba(0,229,255,.5);background:rgba(0,229,255,.1);box-shadow:0 0 24px rgba(0,229,255,.18)}
    .badge.soon{color:var(--amber);border:1px solid rgba(255,200,87,.5);background:rgba(255,200,87,.1);box-shadow:0 0 24px rgba(255,200,87,.14)}
    .badge.done{color:var(--t-mid);border:1px solid var(--line);background:rgba(255,255,255,.06)}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

    .subject{
      font-family:'Noto Serif SC','HarmonyOS Sans',sans-serif;
      font-size:clamp(2.3rem,min(8.5vw,11vh),7.8rem);font-weight:900;line-height:1.06;letter-spacing:.06em;
      background:linear-gradient(180deg,#ffffff 10%,rgba(255,255,255,.78) 60%,rgba(180,220,255,.55) 100%);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 18px rgba(0,229,255,.28)) drop-shadow(0 2px 4px rgba(0,0,0,.5));
      text-shadow:none;
    }
    .subject-range{
      font-size:clamp(0.66rem,1.8vh,1rem);color:var(--t-mid);letter-spacing:.14em;
      font-variant-numeric:tabular-nums;
    }

    /* 倒计时（时:分:秒 分块式样） */
    .hint{font-size:clamp(0.7rem,1.9vh,1.05rem);color:var(--t-low);letter-spacing:.3em;text-transform:uppercase}
    .countdown{display:flex;align-items:flex-start;gap:clamp(2px,.5vw,8px)}
    .cd-unit{display:flex;flex-direction:column;align-items:center;min-width:clamp(60px,min(9vw,10.5vh),140px)}
    .cd-num{
      font-family:'Bebas Neue','HarmonyOS Sans',sans-serif;
      font-size:clamp(3.6rem,min(11vw,13vh),11rem);font-weight:400;line-height:.95;letter-spacing:.02em;
      font-variant-numeric:tabular-nums;
      background:linear-gradient(180deg,#dffbff 0%,#7ff3ff 30%,var(--neon) 65%,#0891b2 100%);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 12px rgba(0,229,255,.6)) drop-shadow(0 0 34px rgba(0,229,255,.35));
      transition:filter .4s ease,background .4s ease;
    }
    .cd-lbl{font-size:clamp(0.48rem,1.4vh,0.75rem);color:var(--t-low);letter-spacing:.2em;margin-top:4px}
    .cd-sep{
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(3rem,min(8vw,10.5vh),8rem);font-weight:300;line-height:.95;color:var(--neon-dim);
      text-shadow:0 0 16px rgba(0,229,255,.4);padding-top:.02em;
    }

    /* 告警态：最后 5 分钟红色荧光 */
    .hero.warning .cd-num{
      background:linear-gradient(180deg,#ffe2e8 0%,#ff9db0 30%,var(--warn) 65%,#c81e3a 100%);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 14px rgba(255,59,92,.8)) drop-shadow(0 0 40px rgba(255,59,92,.4));
    }
    .hero.warning .badge.live{color:var(--warn);border-color:rgba(255,59,92,.55);background:rgba(255,59,92,.12);box-shadow:0 0 28px rgba(255,59,92,.25)}
    .hero.warning .cd-sep{color:rgba(255,59,92,.55);text-shadow:0 0 16px rgba(255,59,92,.5)}
    .hero.warning .hint{color:var(--warn);text-shadow:0 0 12px rgba(255,59,92,.4)}

    /* 圆环进度 */
    .ring-wrap{position:relative;width:clamp(88px,min(12vw,13vh),150px);height:clamp(88px,min(12vw,13vh),150px);flex-shrink:0}
    .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
    .ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:5}
    .ring-fg{
      fill:none;stroke:var(--neon);stroke-width:5;stroke-linecap:round;
      transition:stroke-dashoffset .5s linear, stroke .4s ease;
      filter:drop-shadow(0 0 7px rgba(0,229,255,.7)) drop-shadow(0 0 16px rgba(0,229,255,.35));
    }
    .hero.warning .ring-fg{stroke:var(--warn);filter:drop-shadow(0 0 8px rgba(255,59,92,.8)) drop-shadow(0 0 18px rgba(255,59,92,.4))}
    .ring-pct{
      position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    }
    .ring-pct .v{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.3rem,min(3vw,3.2vh),2.4rem);color:var(--t-hi);letter-spacing:.03em;line-height:1}
    .ring-pct .k{font-size:clamp(0.5rem,.7vw,0.65rem);color:var(--t-low);letter-spacing:.12em}

    /* 下一场信息条 */
    .next-strip{
      width:min(92%,600px);
      display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
      padding:clamp(8px,1.3vh,14px) clamp(12px,1.6vw,20px);border-radius:16px;
      background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.22);
      font-size:clamp(0.7rem,1.8vh,1.05rem);color:var(--t-mid);letter-spacing:.06em;
      box-shadow:0 0 26px rgba(0,229,255,.12);
    }
    .next-strip b{color:var(--neon);font-weight:700;text-shadow:0 0 10px rgba(0,229,255,.5)}
    .next-strip .arrow{color:var(--neon)}

    /* ---------- 右栏：日程 + 须知 ---------- */
    .side{display:flex;flex-direction:column;gap:clamp(10px,1.5vh,18px);min-height:0}
    .side .glass-card{padding:clamp(12px,1.6vh,20px) clamp(14px,1.5vw,22px);min-height:0}

    .card-title{
      display:flex;align-items:center;gap:10px;
      font-size:clamp(0.76rem,1.9vh,1.1rem);font-weight:800;color:var(--t-hi);letter-spacing:.12em;
      margin-bottom:clamp(8px,1vh,14px);
    }
    .card-title .bar{width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--neon),var(--purple-deep));box-shadow:0 0 12px rgba(0,229,255,.6)}

    /* 垂直荧光时间轴 */
    .timeline{position:relative;list-style:none;display:flex;flex-direction:column;padding-left:26px}
    .timeline::before{
      content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;
      background:linear-gradient(180deg,rgba(0,229,255,.5),rgba(124,58,237,.4),rgba(255,255,255,.06));
      box-shadow:0 0 8px rgba(0,229,255,.3);
    }
    .timeline li{position:relative;padding:clamp(5px,.9vh,11px) 0}
    .timeline .dot{
      position:absolute;left:-26px;top:50%;transform:translateY(-50%);
      width:16px;height:16px;border-radius:50%;
      border:2px solid rgba(255,255,255,.25);background:#0a0f1c;
      display:flex;align-items:center;justify-content:center;
    }
    .timeline .dot::after{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0}
    .timeline li.done .dot{color:var(--t-dim);border-color:rgba(255,255,255,.14)}
    .timeline li.done .dot::after{opacity:1;background:rgba(255,255,255,.3);box-shadow:none}
    .timeline li.current .dot{color:var(--neon);border-color:var(--neon);box-shadow:0 0 14px rgba(0,229,255,.8)}
    .timeline li.current .dot::after{opacity:1;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:blink 1.1s step-end infinite}
    .timeline li.upcoming .dot{color:var(--amber);border-color:rgba(255,200,87,.6)}
    .timeline li.upcoming .dot::after{opacity:1;background:var(--amber);box-shadow:0 0 8px rgba(255,200,87,.7)}

    .t-row{display:flex;align-items:center;gap:12px}
    .t-name{font-size:clamp(0.8rem,2vh,1.2rem);font-weight:800;color:var(--t-hi);letter-spacing:.04em}
    .t-time{margin-left:auto;font-size:clamp(0.58rem,1.6vh,0.9rem);color:var(--t-low);letter-spacing:.05em;font-variant-numeric:tabular-nums}
    .t-status{
      font-size:clamp(0.5rem,1.5vh,0.72rem);font-weight:700;letter-spacing:.08em;padding:.28em .85em;border-radius:999px;flex-shrink:0;
    }
    .timeline li.done .t-status{color:var(--t-dim);background:rgba(255,255,255,.05)}
    .timeline li.done .t-name,.timeline li.done .t-time{color:var(--t-dim);opacity:.55;text-decoration:line-through}
    .timeline li.current .t-status{color:var(--neon);background:rgba(0,229,255,.12);box-shadow:0 0 14px rgba(0,229,255,.2)}
    .timeline li.current .t-name{color:var(--neon);text-shadow:0 0 12px rgba(0,229,255,.45)}
    .timeline li.current .t-time{color:var(--t-hi)}
    .timeline li.upcoming .t-status{color:var(--amber);background:rgba(255,200,87,.1)}
    .timeline li.upcoming .t-name{color:var(--t-mid)}

    /* 须知 */
    .notice{list-style:none;display:flex;flex-direction:column;gap:clamp(5px,.9vh,10px)}
    .notice li{
      display:flex;gap:12px;align-items:flex-start;
      font-size:clamp(0.72rem,1.8vh,1.05rem);color:var(--t-mid);line-height:1.55;letter-spacing:.03em;
    }
    .notice li .idx{
      flex-shrink:0;width:20px;height:20px;border-radius:6px;
      display:flex;align-items:center;justify-content:center;
      font-family:'Bebas Neue',sans-serif;font-size:.82rem;color:var(--neon);
      background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.28);
      box-shadow:0 0 10px rgba(0,229,255,.18);
    }
    .notice li .idx.warn{color:var(--warn);background:rgba(255,59,92,.1);border-color:rgba(255,59,92,.32);box-shadow:0 0 10px rgba(255,59,92,.2)}

    /* 空态 */
    .empty{color:var(--t-dim);text-align:center;padding:40px 0;letter-spacing:.12em;font-size:clamp(0.8rem,1vw,0.95rem)}

    /* ---------- 管理后台 ---------- */
    #adminToggle{
      position:fixed;bottom:24px;right:24px;z-index:200;
      width:46px;height:46px;border-radius:50%;
      background:rgba(255,255,255,.08);backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;font-size:20px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all .3s ease;box-shadow:0 4px 16px rgba(0,0,0,.3);
    }
    #adminToggle:hover{background:rgba(255,255,255,.15);transform:scale(1.08)}
    #adminToggle.active{background:rgba(0,229,255,.25);border-color:var(--neon)}
    #adminPanel{
      position:fixed;bottom:80px;right:24px;z-index:200;
      width:clamp(320px,36vw,460px);max-height:72vh;overflow-y:auto;
      background:rgba(15,15,30,.96);backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,.1);border-radius:16px;
      padding:clamp(16px,2vw,22px);display:none;
      box-shadow:0 16px 48px rgba(0,0,0,.4);
    }
    #adminPanel.open{display:block}
    #adminPanel h3{font-size:clamp(0.85rem,1.1vw,1rem);font-weight:700;color:#fff;margin-bottom:14px;letter-spacing:.06em;display:flex;align-items:center;gap:8px}

<script>
(function(){
'use strict'

/* ============ 只读模式：管理仅限本地 ============ */
var IS_LOCAL = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'

/* ============ 默认配置 ============ */
var DEFAULT_CONFIG = {
  "title": "考场 · 任务大屏",
  "subtitle": "沉着冷静 · 认真作答 · 诚信考试",
  "notice": [
    "请考生携带准考证和身份证入场，对号入座。",
    "开考后 15 分钟禁止入场，不得提前交卷。",
    "请将手机等电子设备关机，放在监考老师指定位置。",
    "考试结束铃响后立即停笔，等待收卷后再离场。"
  ],
  "schedule": [
    { "name": "语文", "start": "08:30", "duration": 150 },
    { "name": "数学", "start": "14:00", "duration": 120 },
    { "name": "英语", "start": "16:30", "duration": 100 }
  ]
}

var STORE_KEY = 'bigscreenConfigV1'

/* ============ 数据加载 ============ */
function loadConfig(){
  try{
    var s = localStorage.getItem(STORE_KEY)
    if(s){
      var d = JSON.parse(s)
      if(d && d.schedule && Array.isArray(d.schedule) && d.schedule.length){
        return d
      }
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_CONFIG))
}
function saveConfig(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(config)) }catch(e){} }
var config = loadConfig()

/* ============ 工具函数 ============ */
function pad(n){ return String(Math.max(0,n)).padStart(2,'0') }
function clamp(v){ return Math.max(0, Math.min(1, v)) }
function toTime(t){ // "HH:MM" -> 今日 Date
  var p = String(t).split(':').map(Number)
  var d = new Date(); d.setHours(p[0], p[1], 0, 0); return d
}
function fmtClock(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()) }
function fmtDur(ms){ // HH:MM:SS
  if(ms < 0) ms = 0
  var s = Math.floor(ms/1000)
  return pad(Math.floor(s/3600)) + ':' + pad(Math.floor((s%3600)/60)) + ':' + pad(s%60)
}
function buildSchedule(){
  return config.schedule.map(function(it){
    var st = toTime(it.start)
    return { name: it.name, start: st, end: new Date(st.getTime() + it.duration*60000), duration: it.duration }
  })
}
function compute(now, sch){
  var current = null, next = null
  for(var i=0;i<sch.length;i++){
    var s = sch[i]
    if(now >= s.start && now < s.end){ current = s; next = sch[i+1] || null; break }
    if(now < s.start){ next = s; break }
  }
  return { current: current, next: next }
}

/* ============ 渲染：标题/须知/日程 ============ */
function applyMeta(){
  document.title = (config.title || '大屏') + ' · XxPuan\'s Value'
  renderNotice()
  renderTimelineStatic()
}

function renderNotice(){
  var ol = document.getElementById('notice')
  if(!config.notice || !config.notice.length){
    ol.innerHTML = '<li class="empty">暂无须知</li>'
    return
  }
  ol.innerHTML = config.notice.map(function(n, i){
    return '<li><span class="idx">' + pad(i+1) + '</span><span>' + esc(n) + '</span></li>'
  }).join('')
}

function renderTimelineStatic(){
  // 只渲染一次静态骨架，状态由 tick 更新
  var ul = document.getElementById('timeline')
  if(!config.schedule.length){
    ul.innerHTML = '<li class="empty">今日暂无安排</li>'
    return
  }
  ul.innerHTML = config.schedule.map(function(it, i){
    var st = toTime(it.start), en = new Date(st.getTime() + it.duration*60000)
    return '<li id="tl'+i+'">' +
      '<span class="dot"></span>' +
      '<div class="t-row">' +
        '<span class="t-name">' + esc(it.name) + '</span>' +
        '<span class="t-time">' + fmtClock(st) + ' – ' + fmtClock(en) + '</span>' +
        '<span class="t-status" id="tlst'+i+'">未开始</span>' +
      '</div>' +
    '</li>'
  }).join('')
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

/* ============ 倒计时主循环 ============ */
var CIRC = 2 * Math.PI * 46 // 289.03

function setCountdown(ms){
  var s = Math.floor(ms/1000)
  document.getElementById('cdH').textContent = pad(Math.floor(s/3600))
  document.getElementById('cdM').textContent = pad(Math.floor((s%3600)/60))
  document.getElementById('cdS').textContent = pad(s%60)
}

function tick(){
  var now = new Date()

  // 页眉时钟
  document.getElementById('gsClock').textContent = now.toLocaleTimeString('zh-CN', { hour12: false })

  // 信息条
  var weekTxt = now.toLocaleDateString('zh-CN', { weekday: 'long' })
  document.getElementById('infoDate').firstChild.nodeValue = now.toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric' }) + ' '
  document.getElementById('infoWeek').textContent = weekTxt

  var sch = buildSchedule()
  var st = compute(now, sch)

  // 概览：已结束 / 进行中 / 未开始 场次统计
  var done = 0, cur = 0, upcoming = 0
  sch.forEach(function(s){
    if(now >= s.end) done++
    else if(now >= s.start && now < s.end) cur++
    else upcoming++
  })
  document.getElementById('infoSummary').innerHTML =
    '今日共 <b>' + sch.length + '</b> 场 · 已结束 <b>' + done + '</b> · 进行中 <b>' + cur + '</b> · 未开始 <b>' + upcoming + '</b>'

  var badge = document.getElementById('badge')
  var badgeText = document.getElementById('badgeText')
  var subject = document.getElementById('subject')
  var subjectRange = document.getElementById('subjectRange')
  var hint = document.getElementById('hint')
  var ring = document.getElementById('ring')
  var ringPct = document.getElementById('ringPct')
  var nextStrip = document.getElementById('nextStrip')
  var hero = document.getElementById('hero')

  if(st.current){
    var remain = st.current.end - now
    var total = st.current.duration * 60000
    var elapsed = now - st.current.start
    var pct = clamp(elapsed / total)

    badge.className = 'badge live'
    badgeText.textContent = '正在进行'
    subject.textContent = st.current.name
    subjectRange.textContent = fmtClock(st.current.start) + ' – ' + fmtClock(st.current.end)
    hint.textContent = '距本场结束'
    setCountdown(remain)
    ring.setAttribute('stroke-dashoffset', (CIRC * (1 - pct)).toFixed(2))
    ringPct.textContent = Math.round(pct*100) + '%'

    if(st.next){
      nextStrip.innerHTML = '<span>下一场</span><span class="arrow">▶</span><b>' + esc(st.next.name) + '</b>' +
        '<span>' + fmtClock(st.next.start) + ' 开始</span><span>· 距开始 <b>' + fmtDur(st.next.start - now) + '</b></span>'
    }else{
      nextStrip.innerHTML = '<span>这是今日<b>最后一场</b>，请坚持到最后</span>'
    }

    applyWarning(remain < 5*60000)
    ensureBorder(true)
  } else if(st.next){
    var wait = st.next.start - now
    badge.className = 'badge soon'
    badgeText.textContent = '即将开始'
    subject.textContent = st.next.name
    subjectRange.textContent = fmtClock(st.next.start) + ' – ' + fmtClock(st.next.end)
    hint.textContent = '距开始'
    setCountdown(wait)
    ring.setAttribute('stroke-dashoffset', CIRC.toFixed(2))
    ringPct.textContent = '--'
    nextStrip.innerHTML = '<span>本场时长 <b>' + st.next.duration + '</b> 分钟 · ' + fmtClock(st.next.start) + ' 开始</span>'
    applyWarning(false)
    ensureBorder(false)
  } else {
    badge.className = 'badge done'
    badgeText.textContent = '已结束'
    subject.textContent = '今日安排已全部结束'
    subjectRange.textContent = ''
    hint.textContent = ''
    setCountdown(0)
    ring.setAttribute('stroke-dashoffset', '0')
    ringPct.textContent = '100%'
    nextStrip.innerHTML = '<span>感谢参与，祝取得好成绩</span>'
    applyWarning(false)
    ensureBorder(false)
  }

  updateTimeline(sch, st.current, now)
}

function updateTimeline(sch, current, now){
  sch.forEach(function(s, i){
    var li = document.getElementById('tl'+i)
    var stEl = document.getElementById('tlst'+i)
    if(!li || !stEl) return
    var cls, txt
    if(current && s === current){ cls = 'current'; txt = '进行中' }
    else if(now >= s.end){ cls = 'done'; txt = '已结束' }
    else { cls = 'upcoming'; txt = '未开始' }
    li.className = cls
    stEl.textContent = txt
  })
}

function applyWarning(w){
  document.getElementById('hero').classList.toggle('warning', w)
}

/* ============ ElectricBorder 荧光电流边框引擎 ============ */
var ebState = { cleanup: null, active: false }
var heroEl = document.getElementById('hero')

function ensureBorder(active){
  if(active && !ebState.active){
    ebState.cleanup = createElectricBorder(heroEl, 'rgba(0,229,255,.95)', 1.6, 0.2, 26)
    ebState.active = true
  }else if(!active && ebState.active && ebState.cleanup){
    ebState.cleanup(); ebState.cleanup = null; ebState.active = false
  }
}

var ebRand = function(x){ return (Math.sin(x*12.9898)*43758.5453)%1 }
function ebN2d(x,y){
  var i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j
  var a=ebRand(i+j*57),b=ebRand(i+1+j*57),c=ebRand(i+(j+1)*57),d=ebRand(i+1+(j+1)*57)
  var ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy)
  return a*(1-ux)*(1-uy)+b*ux*(1-uy)+c*(1-ux)*uy+d*ux*uy
}
function ebOct(x,octaves,lac,gain,amp,freq,time,seed,flat){
  var y=0,a=amp,f=freq
  for(var i=0;i<octaves;i++){ var oa=i===0?a*flat:a; y+=oa*ebN2d(f*x+seed*100,time*f*.3); f*=lac; a*=gain }
  return y
}
function ebCorner(cx,cy,r,sa,al,pct){ var a=sa+pct*al; return { x:cx+r*Math.cos(a), y:cy+r*Math.sin(a) } }
function ebRndRectP(t,l,tp,w,h,r){
  var sw=w-2*r,sh=h-2*r,ca=Math.PI*r/2,peri=2*sw+2*sh+4*ca,d=t*peri,acc=0
  if(d<=acc+sw)return{x:l+r+(d-acc)/sw*sw,y:tp}
  acc+=sw;if(d<=acc+ca)return ebCorner(l+w-r,tp+r,r,-Math.PI/2,Math.PI/2,(d-acc)/ca)
  acc+=ca;if(d<=acc+sh)return{x:l+w,y:tp+r+(d-acc)/sh*sh}
  acc+=sh;if(d<=acc+ca)return ebCorner(l+w-r,tp+h-r,r,0,Math.PI/2,(d-acc)/ca)
  acc+=ca;if(d<=acc+sw)return{x:l+w-r-(d-acc)/sw*sw,y:tp+h}
  acc+=sw;if(d<=acc+ca)return ebCorner(l+r,tp+h-r,r,Math.PI/2,Math.PI/2,(d-acc)/ca)
  acc+=ca;if(d<=acc+sh)return{x:l,y:tp+h-r-(d-acc)/sh*sh}
  acc+=sh;return ebCorner(l+r,tp+r,r,Math.PI,Math.PI/2,(d-acc)/ca)
}
function createElectricBorder(hostEl,color,speed,chaos,br){
  var origOv = hostEl.style.overflow
  hostEl.style.overflow = 'visible'

  var g1=document.createElement('div');g1.style.cssText='position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;border:2px solid '+color+';filter:blur(1px);opacity:.55;box-sizing:border-box'
  var g2=document.createElement('div');g2.style.cssText='position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;border:2px solid '+color+';filter:blur(5px);opacity:.35;box-sizing:border-box'
  var gbg=document.createElement('div');gbg.style.cssText='position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;filter:blur(34px);opacity:.28;background:linear-gradient(-30deg,'+color+',transparent,'+color+')'
  hostEl.appendChild(g1);hostEl.appendChild(g2);hostEl.appendChild(gbg)

  var cc=document.createElement('div');cc.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:4'
  var ca=document.createElement('canvas');ca.style.cssText='display:block'
  cc.appendChild(ca);hostEl.appendChild(cc)
  var ctx=ca.getContext('2d');if(!ctx)return function(){}

  var off=40,O=10,lac=1.6,gn=0.7,amp=chaos,freq=10,flat=0,dsc=60
  var raf=0,time=0,lastT=0,dpr=Math.min(devicePixelRatio||1,2)
  function resize(){
    var rect=hostEl.getBoundingClientRect()
    var w=rect.width+off*2,h2=rect.height+off*2
    dpr=Math.min(devicePixelRatio||1,2)
    ca.width=w*dpr;ca.height=h2*dpr
    ca.style.width=w+'px';ca.style.height=h2+'px'
    return{w:w,h:h2}
  }
  var dims=resize()
  var ro=new ResizeObserver(function(){ dims=resize() });ro.observe(hostEl)
  var stopped=false
  function draw(tm){
    if(stopped)return
    if(!lastT)lastT=tm
    time+=(tm-lastT)/1e3*speed;lastT=tm
    var w=dims.w,h=dims.h
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,ca.width,ca.height);ctx.scale(dpr,dpr)
    ctx.strokeStyle=color;ctx.lineWidth=1.6;ctx.lineCap='round';ctx.lineJoin='round'
    var L=off,WW=w-2*L,HH=h-2*L,mxR=Math.min(WW,HH)/2,R=Math.min(br||24,mxR)
    var cnt=Math.floor((2*(WW+HH)+2*Math.PI*R)/2)
    ctx.beginPath()
    for(var i=0;i<=cnt;i++){
      var pr=i/cnt,pt=ebRndRectP(pr,L,L,WW,HH,R)
      var nx=ebOct(pr*8,O,lac,gn,amp,freq,time,0,flat)*dsc
      var ny=ebOct(pr*8,O,lac,gn,amp,freq,time,1,flat)*dsc
      i===0?ctx.moveTo(pt.x+nx,pt.y+ny):ctx.lineTo(pt.x+nx,pt.y+ny)
    }
    ctx.closePath();ctx.stroke()
    raf=requestAnimationFrame(draw)
  }
  raf=requestAnimationFrame(draw)
  return function cleanup(){
    stopped=true;if(raf)cancelAnimationFrame(raf)
    ro.disconnect();hostEl.style.overflow=origOv
    if(g1.parentNode)hostEl.removeChild(g1)
    if(g2.parentNode)hostEl.removeChild(g2)
    if(gbg.parentNode)hostEl.removeChild(gbg)
    if(cc.parentNode)hostEl.removeChild(cc)
  }
}

/* ============ 管理后台 ============ */
function buildAdminForm(){
  var body = document.getElementById('adminBody')
  var html = ''
  html += '<div class="admin-group"><div class="g-title">基本信息</div>'
  html += '<div class="admin-field"><label>标题</label><input id="af-title" value="' + esc(config.title || '') + '"></div>'
  html += '<div class="admin-field"><label>副标题</label><input id="af-subtitle" value="' + esc(config.subtitle || '') + '"></div>'
  html += '<div class="admin-field"><label>须知（每行一条）</label><textarea id="af-notice" rows="4">' + esc((config.notice||[]).join('\n')) + '</textarea></div>'
  html += '</div>'
  html += '<div class="admin-group"><div class="g-title">日程安排</div><div id="af-sched"></div>'
  html += '<button class="btn-block" id="af-add">＋ 添加一场</button></div>'
  body.innerHTML = html
  renderSchedRows()
  document.getElementById('af-add').addEventListener('click', function(){
    config.schedule.push({ name:'', start:'09:00', duration:60 })
    renderSchedRows()
  })
}

function renderSchedRows(){
  var wrap = document.getElementById('af-sched')
  wrap.innerHTML = config.schedule.map(function(it, i){
    return '<div class="sched-item" data-i="'+i+'">' +
      '<input class="sf-name" placeholder="名称" value="' + esc(it.name) + '">' +
      '<input class="sf-start" type="time" value="' + esc(it.start) + '">' +
      '<input class="sf-dur" type="number" min="1" placeholder="分钟" value="' + it.duration + '">' +
      '<button class="del" title="删除">✕</button>' +
    '</div>'
  }).join('')
  wrap.querySelectorAll('.sched-item').forEach(function(row){
    row.querySelector('.del').addEventListener('click', function(){
      config.schedule.splice(parseInt(row.dataset.i,10), 1)
      renderSchedRows()
    })
  })
}

function readAdminForm(){
  var title = document.getElementById('af-title').value.trim()
  var subtitle = document.getElementById('af-subtitle').value.trim()
  var notice = document.getElementById('af-notice').value.split('\n').map(function(s){ return s.trim() }).filter(Boolean)
  var sched = []
  var valid = true
  document.querySelectorAll('#af-sched .sched-item').forEach(function(row){
    var name = row.querySelector('.sf-name').value.trim()
    var start = row.querySelector('.sf-start').value
    var dur = parseInt(row.querySelector('.sf-dur').value, 10)
    if(!name){ valid = false; row.querySelector('.sf-name').focus(); return }
    if(!start){ valid = false; row.querySelector('.sf-start').focus(); return }
    if(!dur || dur < 1){ valid = false; row.querySelector('.sf-dur').focus(); return }
    sched.push({ name: name, start: start, duration: dur })
  })
  if(!valid){ alert('请完整填写日程：名称、开始时间、时长（分钟）都不能为空'); return null }
  return { title: title, subtitle: subtitle, notice: notice, schedule: sched }
}

var adminToggle = document.getElementById('adminToggle')
var adminPanel = document.getElementById('adminPanel')
if(!IS_LOCAL){ adminToggle.style.display = 'none' }

adminToggle.addEventListener('click', function(){
  var open = adminPanel.classList.toggle('open')
  adminToggle.classList.toggle('active', open)
  if(open) buildAdminForm()
})

document.getElementById('adminSave').addEventListener('click', function(){
  var d = readAdminForm()
  if(!d) return
  config = d
  saveConfig()
  adminPanel.classList.remove('open')
  adminToggle.classList.remove('active', false)
  applyMeta()
  tick()
})

document.getElementById('adminReset').addEventListener('click', function(){
  if(!confirm('确定恢复为默认配置吗？当前修改将被覆盖。')) return
  localStorage.removeItem(STORE_KEY)
  config = JSON.parse(JSON.stringify(DEFAULT_CONFIG))
  applyMeta()
  tick()
})

document.getElementById('adminExport').addEventListener('click', function(){
  var d = readAdminForm() || config
  var code = '  var DEFAULT_CONFIG = ' + JSON.stringify(d, null, 2).replace(/^(.)/gm, '  $1')
  document.getElementById('exportCode').textContent = code
  document.getElementById('exportModal').classList.add('open')
})

document.getElementById('exportCopyBtn').addEventListener('click', function(){
  var pre = document.getElementById('exportCode'), btn = this
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(pre.textContent).then(function(){
      btn.textContent='已复制 ✓';btn.classList.add('copied')
      setTimeout(function(){ btn.textContent='复制代码';btn.classList.remove('copied') },2000)
    })
  }else{
    var sel=window.getSelection(),range=document.createRange()
    range.selectNodeContents(pre);sel.removeAllRanges();sel.addRange(range)
    document.execCommand('copy');sel.removeAllRanges()
    btn.textContent='已复制 ✓';btn.classList.add('copied')
    setTimeout(function(){ btn.textContent='复制代码';btn.classList.remove('copied') },2000)
  }
})
document.getElementById('exportCloseBtn').addEventListener('click', function(){
  document.getElementById('exportModal').classList.remove('open')
})
document.getElementById('exportModal').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('open')
})

/* ============ 玻璃页眉 SVG 折射 ============ */
var gsEl = document.getElementById('glassSurface')
window.addEventListener('scroll', function(){ gsEl.style.background = window.scrollY > 30 ? 'rgba(255,255,255,.035)' : '' }, {passive:true})
var isChromium = !(/Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent)) && !/Firefox/.test(navigator.userAgent)
var td = document.createElement('div'); td.style.backdropFilter = 'url(#gsFilter)'
var supportsSvg = td.style.backdropFilter !== '' && isChromium
gsEl.classList.add(supportsSvg ? 'gs--svg' : 'gs--fallback')
if(supportsSvg) gsEl.style.setProperty('--gs-filter', 'url(#gsFilter)')
var distortionScale=-180, redOffset=0, greenOffset=10, blueOffset=20
var borderWidth=.07, brightness=50, opacity=.93, blurAmt=11, borderRadius=50, mixBlendMode='difference'
function genMap(el,w,h){
  var e=Math.min(w,h)*borderWidth*.5
  return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><defs><linearGradient id="rg" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#0000"/><stop offset="100%" stop-color="red"/></linearGradient><linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#0000"/><stop offset="100%" stop-color="blue"/></linearGradient></defs><rect fill="black" width="'+w+'" height="'+h+'"/><rect rx="'+borderRadius+'" width="'+w+'" height="'+h+'" fill="url(#rg)"/><rect rx="'+borderRadius+'" width="'+w+'" height="'+h+'" fill="url(#bg)" style="mix-blend-mode:'+mixBlendMode+'"/><rect x="'+e+'" y="'+e+'" width="'+(w-e*2)+'" height="'+(h-e*2)+'" rx="'+borderRadius+'" fill="hsl(0 0% '+brightness+'% / '+opacity+')" style="filter:blur('+blurAmt+'px)"/></svg>')
}
function updateGS(){
  if(!supportsSvg) return
  var m=document.getElementById('feMap')
  if(m){ var r=gsEl.getBoundingClientRect(); if(r.width>1) m.setAttribute('href', genMap(gsEl,r.width,r.height)) }
  var r2=document.getElementById('feRed'),g2=document.getElementById('feGreen'),b2=document.getElementById('feBlue')
  if(r2) r2.setAttribute('scale', distortionScale+redOffset)
  if(g2) g2.setAttribute('scale', distortionScale+greenOffset)
  if(b2) b2.setAttribute('scale', distortionScale+blueOffset)
}
updateGS()
var rt2
window.addEventListener('resize', function(){ clearTimeout(rt2); rt2=setTimeout(updateGS,150) })
if(window.ResizeObserver) new ResizeObserver(function(){ clearTimeout(rt2); rt2=setTimeout(updateGS,100) }).observe(gsEl)

/* ============ 鼠标光晕 ============ */
var glow=document.createElement('div')
glow.style.cssText='position:fixed;top:0;left:0;width:700px;height:700px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(0,229,255,.12),rgba(124,58,237,.06) 40%,transparent 70%)'
document.body.appendChild(glow)
var mx=0,my=0,gx=0,gy=0
document.addEventListener('mousemove',function(e){ mx=e.clientX; my=e.clientY })
;(function anim(){ gx+=(mx-gx)*.03; gy+=(my-gy)*.03; glow.style.transform='translate('+(gx-350)+'px,'+(gy-350)+'px)'; requestAnimationFrame(anim) })()

/* ============ 启动 ============ */
applyMeta()
tick()
setInterval(tick, 1000)
})()
