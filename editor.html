<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>博客编辑器</title>
<link rel="icon" href="assets/LOGO.png" type="image/png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#7C3AED;--pl:#A855F7;--bg:#08080E;--c15:#F1F1F6;--c13:#D4D4E0;--c12:#B8B8CC;--c10:#8888A0;--c8:#5A5A70}
body{font-family:'HarmonyOS Sans','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--c15);padding:2rem;min-height:100vh}
h1{font-size:1.6rem;font-weight:700;margin-bottom:.3rem}
.sub{color:var(--c8);font-size:.85rem;margin-bottom:2rem}
.wrap{max-width:900px;margin:0 auto}
.tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:.6rem .8rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:12px 12px 0 0;border-bottom:none}
.tb button,.tb select{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:var(--c12);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:13px;transition:all .2s;font-family:inherit}
.tb button:hover,.tb select:hover{background:rgba(124,58,237,.12);color:var(--c15)}
.tb select{padding:4px 6px}
.tb .sp{width:1px;height:20px;background:rgba(255,255,255,.08);margin:0 4px}
.fd{margin-bottom:1rem}
.fd label{display:block;font-size:13px;font-weight:600;color:var(--c10);margin-bottom:6px}
.fd input[type=text],.fd input[type=date]{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:.7rem 1rem;font-family:inherit;font-size:14px;color:var(--c13);outline:none}
.fd input:focus{border-color:rgba(124,58,237,.3)}
.fd .tr{display:flex;gap:1rem}
.fd .tr input{flex:1}
.ed{min-height:300px;padding:1rem 1.2rem;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:0 0 12px 12px;color:var(--c12);font-size:15px;line-height:1.9;outline:none;overflow-y:auto}
.ed:focus{border-color:rgba(124,58,237,.2)}
.ed img{max-width:100%;border-radius:8px;margin:.5rem 0}
.act{display:flex;gap:1rem;margin-top:1.5rem}
.btn{padding:.7rem 1.5rem;border-radius:999px;border:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s}
.btn-p{background:linear-gradient(135deg,var(--p),var(--pl));color:#fff;box-shadow:0 4px 16px rgba(124,58,237,.2)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(124,58,237,.3)}
.btn-o{background:transparent;border:1px solid rgba(255,255,255,.1);color:var(--c12)}
.btn-o:hover{border-color:var(--pl);color:var(--c15)}
.ow{margin-top:2rem;display:none}
.ow.s{display:block}
.ow h3{font-size:1rem;font-weight:600;margin-bottom:.5rem;color:var(--c13)}
.ob{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:1rem;white-space:pre-wrap;word-break:break-all;font-family:'Courier New',monospace;font-size:13px;color:var(--pl);max-height:400px;overflow:auto;line-height:1.6}
.cp{margin-top:.5rem;padding:.5rem 1.2rem;border-radius:999px;border:1px solid rgba(124,58,237,.2);background:rgba(124,58,237,.06);color:var(--pl);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .3s}
.cp:hover{background:rgba(124,58,237,.12)}
.dh{color:var(--c8);font-size:12px;margin-top:.3rem}
@media(max-width:767px){body{padding:1rem}.fd .tr{flex-direction:column}}
</style>
</head>
<body>

<div class="wrap">

<h1>博客编辑器</h1>
<p class="sub">填写内容后点击生成按钮，复制代码粘贴到 blog.html 中</p>

<div class="fd">
<label>发布日期</label>
<div class="tr">
<input type="date" id="pd">
<select id="pt" style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:.7rem 1rem;font-family:inherit;font-size:14px;color:var(--c13);outline:none;min-width:120px">
<option>杂记</option><option>STM32</option><option>AI</option><option>毕设</option><option>鸿蒙</option><option>嵌入式</option><option>生活</option><option>其他</option>
</select>
</div>
</div>

<div class="fd">
<label>文章标题</label>
<input type="text" id="ptitle" placeholder="输入文章标题">
</div>

<div class="fd">
<label>摘要（博客列表显示的简介）</label>
<input type="text" id="pex" placeholder="简短介绍一下这篇文章">
</div>

<div class="fd">
<label>正文内容</label>
<div class="tb">
<button onclick="c('bold')"><b>B</b></button>
<button onclick="c('italic')"><i>I</i></button>
<button onclick="c('underline')"><u>U</u></button>
<span class="sp"></span>
<button onclick="c('insertOrderedList')">列表</button>
<button onclick="c('insertUnorderedList')">列表</button>
<span class="sp"></span>
<button onclick="c('formatBlock','<h2>')">H2</button>
<button onclick="c('formatBlock','<h3>')">H3</button>
<span class="sp"></span>
<select onchange="c('fontSize',this.value)"><option value="3">正常</option><option value="4">大</option><option value="5">更大</option><option value="1">小</option></select>
<button onclick="addImg()">图片</button>
<button onclick="addCd()">代码</button>
</div>
<div class="ed" id="ed" contenteditable="true"></div>
</div>

<div class="act">
<button class="btn btn-p" onclick="gen()">生成 HTML 代码</button>
<button class="btn btn-o" onclick="rst()">清空</button>
</div>

<div class="ow" id="ow">
<h3>生成的代码 - 复制下面内容</h3>
<div class="ob" id="ob"></div>
<button class="cp" onclick="cpy()">复制代码</button>
</div>

</div>

<script>
document.getElementById('pd').valueAsDate = new Date()

function c(cmd,val){document.execCommand(cmd,false,val||null);document.getElementById('ed').focus()}

function addImg(){
  var u=prompt('图片URL:')
  if(u)c('insertImage',u)
}

function addCd(){
  var t=prompt('粘贴代码:')
  if(t){
    var el=document.getElementById('ed')
    var pre=document.createElement('pre')
    var code=document.createElement('code')
    code.textContent=t
    pre.appendChild(code)
    el.appendChild(pre)
    el.appendChild(document.createElement('br'))
  }
}

function fmt(d){
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
  var dd=new Date(d)
  return{
    day:String(dd.getDate()).padStart(2,'0'),
    month:months[dd.getMonth()],
    year:dd.getFullYear(),
    full:dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0')
  }
}

function gen(){
  var dv=document.getElementById('pd').value
  if(!dv){alert('请选择日期');return}
  var ti=document.getElementById('ptitle').value.trim()
  if(!ti){alert('请输入标题');return}
  var tg=document.getElementById('pt').value
  var ex=document.getElementById('pex').value.trim()
  var ct=document.getElementById('ed').innerHTML.trim()
  if(!ct){alert('请输入正文内容');return}
  var fd=fmt(dv)

  var sl=ti.replace(/[^\w\u4e00-\u9fa5]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')||'post'

  var cardHTML=
'    <!-- ' + fd.full + ' ' + ti + ' -->\n' +
'    <div class="blog-entry reveal">\n' +
'      <div class="blog-date">\n' +
'        <span class="dot"></span>\n' +
'        <span class="day">' + fd.day + '</span>\n' +
'        <span class="month">' + fd.month + '</span>\n' +
'        <span class="year">' + fd.year + '</span>\n' +
'      </div>\n' +
'      <div class="blog-card" onclick="location.href=\'posts/' + sl + '.html\'">\n' +
'        <h3>' + ti + '</h3>\n' +
'        <div class="card-date-alt">' + fd.full + '</div>\n' +
'        <p>' + ex + '</p>\n' +
'        <div class="card-tags"><span>' + tg + '</span></div>\n' +
'      </div>\n' +
'    </div>'

  var postHTML=
'<!DOCTYPE html>\n' +
'<html lang="zh-CN">\n' +
'<head>\n' +
'  <meta charset="UTF-8">\n' +
'  <meta name="viewport" content="width=device-width,initial-scale=1">\n' +
'  <title>' + ti + ' - XxPuan</title>\n' +
'  <link rel="preconnect" href="https://fonts.googleapis.com">\n' +
'  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
'  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,500;1,700&display=swap" rel="stylesheet">\n' +
'  <style>\n' +
'    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}\n' +
'    :root{--p:#7C3AED;--pl:#A855F7;--bg:#08080E;--c15:#F1F1F6;--c13:#D4D4E0;--c12:#B8B8CC;--c10:#8888A0;--c8:#5A5A70;--hh:80px}\n' +
'    html{font-family:"HarmonyOS Sans","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c15);-webkit-font-smoothing:antialiased}\n' +
'    body{min-height:100vh}\n' +
'    a{color:inherit;text-decoration:none}\n' +
'    #cg{position:fixed;top:0;left:0;width:900px;height:900px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(124,58,237,.2),rgba(168,85,247,.1) 35%,transparent 68%);transform:translate(-50%,-50%)}\n' +
'    #cg::after{content:"";position:absolute;top:50%;left:50%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.1),transparent 55%);transform:translate(-50%,-50%)}\n' +
'    #hm{height:var(--hh)}\n' +
'    #h{position:fixed;top:0;left:0;z-index:100;width:100%;height:var(--hh);padding:0 2rem;display:flex;align-items:center;background:rgba(8,8,14,.55);backdrop-filter:blur(24px)saturate(1.4);border-bottom:1px solid rgba(255,255,255,.04);box-shadow:0 1px 0 rgba(124,58,237,.08)inset,0 0 60px rgba(124,58,237,.04)}\n' +
'    #h::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(124,58,237,.35)25%,rgba(168,85,247,.5)50%,rgba(124,58,237,.35)75%,transparent 95%);opacity:.8}\n' +
'    #h::after{content:"";position:absolute;bottom:-1px;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(124,58,237,.15),transparent)}\n' +
'    #ht{font-size:16px;font-weight:500;color:var(--c15);display:flex;align-items:center}\n' +
'    #ht b{font-size:22px;font-weight:800;margin-right:2px}\n' +
'    #ht .sf{font-size:16px;font-weight:500;color:var(--c12);letter-spacing:.01em}\n' +
'    main{max-width:800px;margin:0 auto;padding:7rem 2rem 5rem;position:relative;z-index:1}\n' +
'    article h1{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;margin-bottom:.3rem;line-height:1.3}\n' +
'    .pm{color:var(--c8);font-size:14px;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(255,255,255,.05)}\n' +
'    .pm a{color:var(--pl)}\n' +
'    .pc{font-size:16px;color:var(--c12);line-height:2}\n' +
'    .pc h2{font-size:1.4rem;font-weight:700;color:var(--c15);margin:2.5rem 0 .8rem}\n' +
'    .pc h3{font-size:1.2rem;font-weight:600;color:var(--c13);margin:2rem 0 .6rem}\n' +
'    .pc p{margin-bottom:1.2rem}\n' +
'    .pc a{color:var(--pl);border-bottom:1px solid rgba(124,58,237,.2)}\n' +
'    .pc img{max-width:100%;border-radius:12px;margin:1.2rem 0}\n' +
'    .pc blockquote{border-left:3px solid var(--p);padding:.8rem 1.2rem;margin:1.2rem 0;background:rgba(124,58,237,.04);border-radius:0 8px 8px 0;color:var(--c10)}\n' +
'    .pc pre{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:1rem;overflow-x:auto;margin:1.2rem 0}\n' +
'    .pc code{font-size:14px;background:rgba(255,255,255,.04);padding:2px 6px;border-radius:4px;color:var(--pl)}\n' +
'    .pc pre code{background:none;padding:0}\n' +
'    .pc ul,.pc ol{padding-left:1.5rem;margin-bottom:1rem}\n' +
'    .bk{display:inline-flex;align-items:center;gap:6px;color:var(--c10);font-size:14px;margin-bottom:2rem;transition:color .3s}\n' +
'    .bk:hover{color:var(--pl)}\n' +
'    footer{padding:2rem;border-top:1px solid rgba(255,255,255,.04);text-align:center;color:var(--c8);font-size:13px}\n' +
'    .fb{position:fixed;bottom:2.5rem;right:2.5rem;z-index:99;display:inline-flex;align-items:center;gap:8px;padding:0.65rem 1.2rem 0.65rem 1rem;border-radius:999px;background:#fff;color:var(--p);font-size:0.9rem;font-weight:700;border:none;box-shadow:0 4px 20px rgba(124,58,237,.15);transition:all .3s}\n' +
'    .fb:hover{background:var(--pl);color:#fff;transform:translateY(-3px);box-shadow:0 8px 28px rgba(124,58,237,.25)}\n' +
'    @media(max-width:767px){#h{padding:0 1rem}main{padding:6rem 1.5rem 3rem}}\n' +
'  </style>\n' +
'</head>\n' +
'<body>\n' +
'<div id="cg"></div>\n' +
'<div id="hm"></div>\n' +
'<header id="h"><div id="ht"><b>XxPuan</b><span class="sf">s Value</span></div></header>\n' +
'<main>\n' +
'  <a class="bk" href="../blog.html">&larr; 返回博客</a>\n' +
'  <article>\n' +
'    <h1>' + ti + '</h1>\n' +
'    <div class="pm">' + fd.full + ' &middot; <a href="#">#' + tg + '</a></div>\n' +
'    <div class="pc">\n' +
       ct + '\n' +
'    </div>\n' +
'  </article>\n' +
'</main>\n' +
'<a href="../index.html" class="fb">返回首页</a>\n' +
'<footer><div style="max-width:800px;margin:0 auto;text-align:center">&copy; 2026 XxPuan</div></footer>\n' +
'<script>\n' +
'  var g=document.getElementById("cg");var mx=0,my=0,gx=0,gy=0\n' +
'  document.addEventListener("mousemove",function(e){mx=e.clientX;my=e.clientY})\n' +
'  function a(){gx+=(mx-gx)*.02;gy+=(my-gy)*.02;g.style.transform="translate("+(gx-450)+"px,"+(gy-450)+"px)";requestAnimationFrame(a)}\n' +
'  a()\n' +
'<\/script>\n' +
'</body>\n' +
'</html>'

  document.getElementById('mc1').textContent = cardHTML
  document.getElementById('mc2').textContent = postHTML
  document.getElementById('tab1').classList.add('sel')
  document.getElementById('tab2').classList.remove('sel')
  document.getElementById('mc1').style.display='block'
  document.getElementById('mc2').style.display='none'
  document.getElementById('modal').classList.add('s')
  _mode=1
}

var _mode=1

function switchTab(n){
  _mode=n
  document.getElementById('tab1').classList.toggle('sel',n===1)
  document.getElementById('tab2').classList.toggle('sel',n===2)
  document.getElementById('mc1').style.display=n===1?'block':'none'
  document.getElementById('mc2').style.display=n===2?'block':'none'
}

function closeModal(){document.getElementById('modal').classList.remove('s')}

function cpy(){
  var el=_mode===1?document.getElementById('mc1'):document.getElementById('mc2')
  var t=el.textContent
  navigator.clipboard.writeText(t).then(function(){alert('已复制!')}).catch(function(){
    var r=document.createRange()
    r.selectNode(el)
    window.getSelection().removeAllRanges()
    window.getSelection().addRange(r)
    document.execCommand('copy')
    alert('已复制!')
  })
}

function rst(){
  document.getElementById('ptitle').value=''
  document.getElementById('pex').value=''
  document.getElementById('ed').innerHTML=''
  document.getElementById('modal').classList.remove('s')
  document.getElementById('pd').valueAsDate=new Date()
}
</script>

</body>
</html>
