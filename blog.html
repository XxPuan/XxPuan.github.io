<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客 · XxPuan's Value</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,500;1,700&display=swap" rel="stylesheet">
  <style>
    @font-face{font-family:'Bebas Neue';src:url('assets/fonts/BebasNeue-Regular.otf')format('opentype');font-weight:400;font-style:normal;font-display:swap}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--primary-rgb:218,175,75;--primary:#DAAF4B;--primary-light:#F0D060;--diffuse-a:#e7e7a9;--diffuse-b:#e5e37e;--diffuse-c:#559155;--bg:#08080E;--bc15:#F0EEE8;--bc13:#D4CCC0;--bc12:#B8AFA0;--bc10:#9A9080;--bc8:#6B6358;--header-h:80px}
    html{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','HarmonyOS Sans','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--bc15);-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
    body{min-height:100vh;position:relative}
    body::before{
      content:'';position:fixed;inset:0;
      pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 700px 700px at 18% 28%, color-mix(in srgb,var(--diffuse-a) 38%,transparent), transparent 65%),
        radial-gradient(ellipse 600px 600px at 78% 18%, color-mix(in srgb,var(--diffuse-b) 30%,transparent), transparent 65%),
        radial-gradient(ellipse 800px 800px at 45% 82%, color-mix(in srgb,var(--diffuse-c) 28%,transparent), transparent 65%);
    }
    body::after{
      content:'';position:fixed;inset:0;
      pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 400px 400px at 60% 40%, color-mix(in srgb,var(--diffuse-a) 15%,transparent), transparent 60%),
        radial-gradient(ellipse 450px 450px at 30% 70%, color-mix(in srgb,var(--diffuse-b) 12%,transparent), transparent 60%);
      animation:drifting 12s ease-in-out infinite alternate;
    }
    @keyframes drifting{
      0%{transform:translate(0,0)}
      33%{transform:translate(15px,-10px)}
      50%{transform:translate(-10px,15px)}
      100%{transform:translate(10px,-5px)}
    }
    a{color:inherit;text-decoration:none}
    img{-webkit-user-drag:none;user-select:none}

    #cursorGlow{position:fixed;top:0;left:0;width:900px;height:900px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(218,175,75,.10),rgba(240,208,96,.04) 35%,transparent 68%);transform:translate(-50%,-50%)}
    #cursorGlow::after{content:'';position:absolute;top:50%;left:50%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(229,227,126,.04),transparent 55%);transform:translate(-50%,-50%)}

    #headerMark{flex-shrink:0;height:var(--header-h)}
    #header{position:fixed;top:0;left:0;z-index:100;width:100%;height:var(--header-h);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.035);backdrop-filter:blur(22px)saturate(1.8)brightness(1.12);-webkit-backdrop-filter:blur(22px)saturate(1.8)brightness(1.12);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 0 1.5px 1px rgba(255,255,255,.06)inset,0 0 10px 4px rgba(255,255,255,.03)inset,0 4px 16px rgba(0,0,0,.08),0 8px 32px rgba(0,0,0,.05)}
    #header::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(218,175,75,.25)25%,rgba(240,208,96,.4)50%,rgba(218,175,75,.25)75%,transparent 95%);opacity:.9}
    #header::after{content:'';position:absolute;bottom:-1px;left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent,rgba(218,175,75,.12),transparent)}
    #headerTitle{font-size:16px;font-weight:500;color:var(--bc15);display:flex;align-items:center}
    #headerTitle b{font-size:22px;font-weight:800;margin-right:2px}
    #headerTitle .suffix{font-size:16px;font-weight:500;color:var(--bc12);letter-spacing:.01em}
    #headerBadge{height:36px;width:auto;opacity:.85;transition:opacity .3s}
    #headerBadge:hover{opacity:1}

    #progressTrack{position:fixed;top:var(--header-h);left:32px;bottom:0;width:3px;z-index:50;background:rgba(255,255,255,.04)}
    #progressFill{position:absolute;top:0;left:0;width:100%;height:0%;background:linear-gradient(180deg,var(--primary-light),var(--primary));box-shadow:0 0 8px rgba(240,208,96,.3),0 0 20px rgba(218,175,75,.15);transition:height .1s linear}
    #progressGlow{position:absolute;top:0;left:-4px;width:11px;height:100%;background:linear-gradient(180deg,transparent 0%,rgba(240,208,96,.06) 50%,transparent 100%);filter:blur(4px);pointer-events:none}

    .float-back{position:fixed;bottom:2.5rem;right:2.5rem;z-index:99;display:inline-flex;align-items:center;gap:8px;padding:0.65rem 1.2rem 0.65rem 1rem;border-radius:999px;background:#fff;color:var(--primary);font-size:0.9rem;font-weight:700;text-decoration:none;border:none;box-shadow:0 4px 20px rgba(218,175,75,.15);transition:all .3s;cursor:pointer}
    .float-back:hover{background:var(--primary-light);color:#fff;transform:translateY(-3px);box-shadow:0 8px 28px rgba(218,175,75,.25)}
    .float-back .float-back-icon{width:20px;height:20px;object-fit:contain}
    .float-back:hover .float-back-icon{filter:brightness(10)}

    .page-wrap{display:flex;min-height:calc(100vh - var(--header-h))}
    .page{flex:1;padding:3rem 4rem 5rem 4rem;max-width:960px;margin:0 auto;position:relative;z-index:1}

    .page-header{margin-bottom:1.8rem}
    .page-header h1{font-size:clamp(1.8rem,3vw,2.4rem);font-weight:700;margin-bottom:.4rem}
    .page-header .sub{color:var(--bc10);font-size:1rem}

    .tabs{display:flex;gap:10px;margin-bottom:2.2rem;flex-wrap:wrap}
    .tab{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:var(--bc10);padding:.55rem 1.3rem;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;gap:8px}
    .tab:hover{color:var(--bc13);border-color:rgba(218,175,75,.2)}
    .tab.on{background:linear-gradient(135deg,rgba(218,175,75,.18),rgba(240,208,96,.08));border-color:rgba(218,175,75,.45);color:var(--primary-light);box-shadow:0 4px 18px rgba(218,175,75,.12)}
    .tab .cnt{font-size:11px;font-weight:700;opacity:.75;background:rgba(255,255,255,.07);padding:1px 7px;border-radius:999px}
    .panel{display:none}
    .panel.on{display:block}

    .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.6rem;flex-wrap:wrap}
    .sec-head h2{font-size:1.25rem;font-weight:700}
    .sec-head .hint{font-size:13px;color:var(--bc8);margin-top:3px}
    .mini-link{font-size:12.5px;font-weight:600;color:var(--primary-light);border:1px solid rgba(218,175,75,.22);padding:.38rem .95rem;border-radius:999px;transition:all .3s;white-space:nowrap}
    .mini-link:hover{background:rgba(218,175,75,.12);border-color:rgba(218,175,75,.4)}

    .blog-timeline{position:relative;padding-left:100px}
    .timeline-svg{position:absolute;left:80px;top:0;height:100%;width:30px;pointer-events:none;z-index:1}
    .timeline-svg path{fill:none;stroke:url(#curveGrad);stroke-width:2;stroke-linecap:round;opacity:.5}

    .blog-entry{position:relative;margin-bottom:3rem;display:grid;grid-template-columns:80px 1fr;gap:2rem}
    .blog-entry:last-child{margin-bottom:0}

    .blog-date{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-style:italic;text-align:right;padding-top:.3rem;position:relative;z-index:2}
    .blog-date .day{display:inline-block;font-family:'Bebas Neue',-apple-system,'Segoe UI','PingFang SC',sans-serif;font-size:2.6rem;font-weight:400;line-height:1.15;padding:.06em .02em .02em;background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.18));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .blog-date .month{display:block;font-family:'Bebas Neue',-apple-system,'Segoe UI','PingFang SC',sans-serif;font-size:1rem;font-weight:400;text-transform:uppercase;letter-spacing:.1em;color:var(--primary-light);margin-top:1px;line-height:1.2}
    .blog-date .year{display:block;font-family:'Bebas Neue',-apple-system,'Segoe UI','PingFang SC',sans-serif;font-size:.82rem;font-weight:400;color:var(--bc8);letter-spacing:.08em;margin-top:1px;line-height:1.2}
    .blog-date .dot{position:absolute;right:-14px;top:.6rem;width:10px;height:10px;border-radius:50%;background:var(--primary-light);box-shadow:0 0 8px rgba(240,208,96,.4);z-index:3}

    .blog-card{border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:1.5rem 1.8rem;background:rgba(255,255,255,.04);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 4px 24px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.06);transition:all .35s cubic-bezier(.22,1,.36,1);cursor:pointer;position:relative;z-index:2}
    .blog-card:hover{border-color:rgba(218,175,75,.2);background:rgba(255,255,255,.06);transform:translateY(-4px) translateX(6px);box-shadow:0 8px 32px rgba(218,175,75,.08),inset 0 1px 0 rgba(255,255,255,.08)}
    .blog-card h3{font-size:1.15rem;font-weight:600;color:var(--bc13);margin-bottom:.3rem;transition:color .3s}
    .blog-card:hover h3{color:var(--bc15)}
    .blog-card .card-date-alt{font-size:12px;color:var(--bc8);margin-bottom:.6rem}
    .blog-card p{font-size:15px;color:var(--bc10);line-height:1.8}
    .blog-card .card-tags{display:flex;gap:6px;margin-top:.8rem;flex-wrap:wrap}
    .blog-card .card-tags span{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--primary-light);border:1px solid rgba(218,175,75,.2);padding:1px 8px;border-radius:4px}

    /* ---- 人生清单 ---- */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.4rem}
    .stat{position:relative;overflow:hidden;background:rgba(255,255,255,.04);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:.95rem 1.05rem}
    .stat::after{content:'';position:absolute;top:-55%;right:-25%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(218,175,75,.16),transparent 70%);pointer-events:none}
    .stat .k{font-size:11.5px;letter-spacing:.06em;color:var(--bc8);margin-bottom:.35rem}
    .stat .v{font-family:'Bebas Neue',-apple-system,'Segoe UI','PingFang SC',sans-serif;font-size:1.9rem;font-weight:400;color:var(--bc15);line-height:1.1;letter-spacing:.02em}
    .stat .v em{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-style:normal;font-size:.6em;font-weight:600;color:var(--bc10);margin-left:3px;letter-spacing:0}

    .bar-wrap{margin-bottom:1.6rem}
    .bar-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--bc8);margin-bottom:7px}
    #barPct{font-family:'Bebas Neue',-apple-system,'Segoe UI','PingFang SC',sans-serif;font-size:1.1rem;font-weight:400;color:var(--primary-light);letter-spacing:.04em}
    .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.05);overflow:hidden}
    .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--primary-light));box-shadow:0 0 12px rgba(240,208,96,.35);transition:width .7s cubic-bezier(.22,1,.36,1)}

    .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:1.3rem}
    .chip{font-family:inherit;font-size:12.5px;font-weight:600;padding:.34rem .85rem;border-radius:999px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);color:var(--bc10);cursor:pointer;transition:all .25s}
    .chip:hover{color:var(--bc13);border-color:rgba(255,255,255,.14)}
    .chip.on{background:rgba(218,175,75,.13);border-color:rgba(218,175,75,.38);color:var(--primary-light)}
    .chip-sep{width:1px;height:18px;background:rgba(255,255,255,.09);margin:0 3px}

    .life-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .life-card{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:1.1rem 1.25rem 1.1rem 1.4rem;background:rgba(255,255,255,.035);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:all .35s cubic-bezier(.22,1,.36,1);animation:rise .45s both}
    .life-card:hover{transform:translateY(-3px);border-color:rgba(218,175,75,.22);background:rgba(255,255,255,.055);box-shadow:0 8px 28px rgba(0,0,0,.18)}
    .life-card.done{opacity:.55}
    .life-card.done .lc-title{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.28)}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .life-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:rgba(147,163,184,.45)}
    .life-card.s-plan::before{background:repeating-linear-gradient(180deg,rgba(147,163,184,.55) 0 6px,transparent 6px 11px)}
    .life-card.s-doing::before{background:linear-gradient(180deg,var(--primary-light),var(--primary));box-shadow:0 0 12px rgba(240,208,96,.5)}
    .life-card.s-done::before{background:#5AAF7F}
    .life-card.s-plan{background:rgba(255,255,255,.022)}
    .life-card.s-doing{background:linear-gradient(150deg,rgba(218,175,75,.085),rgba(255,255,255,.03) 60%);border-color:rgba(218,175,75,.2)}
    .life-card.s-done{background:rgba(127,209,160,.035);border-color:rgba(127,209,160,.16)}
    .life-card.s-plan:hover{background:rgba(255,255,255,.05);border-color:rgba(147,163,184,.3)}
    .life-card.s-doing:hover{background:linear-gradient(150deg,rgba(218,175,75,.14),rgba(255,255,255,.05) 60%);border-color:rgba(218,175,75,.4);box-shadow:0 8px 30px rgba(218,175,75,.12)}
    .life-card.s-done:hover{background:rgba(127,209,160,.075);border-color:rgba(127,209,160,.3)}
    @keyframes stPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
    .lc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:.5rem}
    .lc-title{font-size:1rem;font-weight:600;color:var(--bc13);line-height:1.5}
    .life-card:hover .lc-title{color:var(--bc15)}
    .lc-cost{font-family:'Bebas Neue',-apple-system,'Segoe UI','PingFang SC',sans-serif;font-size:1.25rem;font-weight:400;color:var(--primary-light);white-space:nowrap;letter-spacing:.03em;line-height:1.2}
    .lc-cost.tbd{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:12px;font-weight:600;color:var(--bc8);letter-spacing:0}
    .lc-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:.55rem}
    .tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid rgba(255,255,255,.1);color:var(--bc10);white-space:nowrap}
    .tag.do{border-color:rgba(240,208,96,.28);color:#F0D060}
    .tag.buy{border-color:rgba(140,180,255,.28);color:#9DBAFF}
    .tag.other{border-color:rgba(200,170,255,.24);color:#C9AEFF}
    .st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid transparent;line-height:1.6}
    .st i{width:6px;height:6px;border-radius:50%;display:block;flex-shrink:0}
    .st-plan{color:#A8B6C9;background:rgba(147,163,184,.1);border-color:rgba(147,163,184,.32);border-style:dashed}
    .st-plan i{background:transparent;border:1.5px solid #A8B6C9;box-sizing:border-box}
    .st-doing{color:#241a04;background:linear-gradient(135deg,#F5D97A,#DAAF4B);border-color:rgba(255,255,255,.22);box-shadow:0 0 12px rgba(240,208,96,.3)}
    .st-doing i{background:#241a04;animation:stPulse 1.5s ease-in-out infinite}
    .st-done{color:#8FE0B0;background:rgba(127,209,160,.14);border-color:rgba(127,209,160,.4)}
    .st-done i{display:none}
    .st-done::before{content:'✓';font-size:10.5px;font-weight:800;line-height:1;margin-right:1px}
    .lc-due{font-size:11.5px;color:var(--bc8)}
    .lc-note{font-size:13px;color:var(--bc10);line-height:1.75;margin-top:.15rem}
    .empty{border:1px dashed rgba(255,255,255,.1);border-radius:16px;padding:3rem 1.5rem;text-align:center;color:var(--bc8);font-size:14px}
    .empty a{color:var(--primary-light);border-bottom:1px solid rgba(218,175,75,.3)}
    .life-foot{margin-top:1.6rem;font-size:12px;color:var(--bc8);display:flex;gap:10px;flex-wrap:wrap;align-items:center}

    footer{padding:2rem 4rem;border-top:1px solid rgba(255,255,255,.04);text-align:center;color:var(--bc8);font-size:13px}
    footer .footer-inner{max-width:960px;margin:0 auto}
    .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
    .reveal.visible{opacity:1;transform:translateY(0)}

    @media screen and (max-width:900px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .life-grid{grid-template-columns:1fr}
    }
    @media screen and (max-width:767px){
      #header{padding:0 1rem}#headerBadge{height:28px}
      #progressTrack{left:0;width:2px}
      .page{padding:2rem 1.5rem 4rem}
      .blog-timeline{padding-left:0}
      .timeline-svg{display:none}
      .blog-entry{grid-template-columns:1fr;gap:.5rem}
      .blog-date{text-align:left;padding-left:1rem}
      .blog-date .dot{left:-6px;right:auto}
      footer{padding:2rem 1.5rem}
    }
  </style>
</head>
<body>
<div id="headerMark"></div>
<header id="header">
  <div id="headerTitle"><b>XxPuan</b><span class="suffix">'s Value</span></div>
  <img id="headerBadge" src="assets/boke.png" alt="博客">
</header>
<div id="cursorGlow"></div>
<div id="progressTrack"><div id="progressFill"></div><div id="progressGlow"></div></div>

<div class="page-wrap">
  <div class="page">
    <div class="page-header reveal reveal-d1">
      <h1>博客</h1>
      <p class="sub">记录、思考与生活</p>
    </div>

    <div class="tabs">
      <button class="tab on" data-tab="blog">博客文章<span class="cnt" id="cntBlog">0</span></button>
      <button class="tab" data-tab="life">人生清单<span class="cnt" id="cntLife">0</span></button>
    </div>

    <!-- 板块一：博客文章 -->
    <section class="panel on" id="panel-blog">
      <div class="sec-head">
        <div>
          <h2>文章时间线</h2>
          <div class="hint">按时间倒序，点击卡片阅读全文</div>
        </div>
        <a class="mini-link" href="editor.html">写新文章</a>
      </div>
      <div id="blogTimeline" class="blog-timeline reveal reveal-d2">
        <svg class="timeline-svg" viewBox="0 0 30 1000" preserveAspectRatio="none">
          <defs>
            <linearGradient id="curveGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(240,208,96,.3)"/>
              <stop offset="50%" stop-color="rgba(218,175,75,.5)"/>
              <stop offset="100%" stop-color="rgba(240,208,96,.15)"/>
            </linearGradient>
          </defs>
          <path d="M15,0 C5,60 25,120 15,180 C5,240 25,300 15,360 C5,420 25,480 15,540 C5,600 25,660 15,720 C5,780 25,840 15,900 C5,960 25,980 15,1000" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>
    </section>

    <!-- 板块二：人生清单 -->
    <section class="panel" id="panel-life">
      <div class="sec-head">
        <div>
          <h2>人生清单</h2>
          <div class="hint">想做 / 想买的事，连同大概花费与完成状态</div>
        </div>
        <a class="mini-link" href="life-editor.html">管理清单</a>
      </div>

      <div class="stats" id="lifeStats"></div>
      <div class="bar-wrap">
        <div class="bar-meta"><span id="barLabel">完成进度</span><span id="barPct">0%</span></div>
        <div class="bar"><i id="barFill"></i></div>
      </div>

      <div class="filters" id="lifeFilters">
        <button class="chip on" data-cat="all">全部</button>
        <button class="chip" data-cat="do">想做</button>
        <button class="chip" data-cat="buy">想买</button>
        <button class="chip" data-cat="other">其他</button>
        <span class="chip-sep"></span>
        <button class="chip on" data-status="all">全部状态</button>
        <button class="chip" data-status="plan">计划中</button>
        <button class="chip" data-status="doing">进行中</button>
        <button class="chip" data-status="done">已完成</button>
      </div>

      <div class="life-grid" id="lifeGrid"></div>
      <div class="life-foot" id="lifeFoot"></div>
    </section>
  </div>
</div>

<script>
const blogPosts = [
  {
    file: 'blog20260727.html',
    date: '2026-07-27',
    title: '中国家庭',
    summary: '',
    tags: ['碎碎念']
  },
  {
    file: 'blog20260724.html',
    date: '2026-07-24',
    title: '逃离',
    summary: '加油，小小轩',
    tags: ['碎碎念']
  },
  {
    file: 'blog20260709.html',
    date: '2026-07-09',
    title: '盛夏近况',
    summary: '九宫格',
    tags: ['图集']
  },
  {
    file: 'blog20260703.html',
    date: '2026-07-03',
    title: '天气 阴',
    summary: '一个人静静，一个人疗伤',
    tags: ['杂记']
  },
  {
    file: 'blog20260702.html',
    date: '2026-07-02',
    title: '天气 小雨',
    summary: '又和妈妈吵架了',
    tags: ['杂记']
  },
  {
    file: '',
    date: '2026-06-28',
    title: '我的未来',
    summary: '矛盾',
    tags: ['杂记', '暂不可查看'],
    disabled: true
  },
  {
    file: 'blog20260615.html',
    date: '2026-06-15',
    title: '我们没有下学期了',
    summary: '九宫格',
    tags: ['杂记','图集']
  },
  {
    file: '',
    date: '2026-06-10',
    title: '你好，世界',
    summary: '这是我的第一篇博客。不知不觉，个人网站已经搭起来了。',
    tags: ['其它','暂不可查看'],
    disabled: true
  }
]
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  })
}

function observeReveals(root){
  var obs = new IntersectionObserver(function(e){
    e.forEach(function(i){ if(i.isIntersecting){ i.target.classList.add('visible'); obs.unobserve(i.target) } })
  }, {threshold:0.12})
  ;(root || document).querySelectorAll('.reveal').forEach(function(el){ obs.observe(el) })
}

function renderPosts(){
  const container = document.getElementById('blogTimeline')
  const svg = container.querySelector('.timeline-svg')
  container.innerHTML = ''
  container.appendChild(svg)
  blogPosts.forEach(post => {
    const [y, m, d] = post.date.split('-')
    const monthAbbr = MONTHS[parseInt(m, 10) - 1]
    const dateLabel = y + ' 年 ' + parseInt(m, 10) + ' 月 ' + parseInt(d, 10) + ' 日'
    const href = post.file ? 'posts/' + post.file : ''
    const disabled = post.disabled || !post.file
    const entry = document.createElement('div')
    entry.className = 'blog-entry reveal'
    entry.innerHTML =
      '<div class="blog-date"><span class="dot"></span><span class="day">' + parseInt(d, 10) + '</span><span class="month">' + monthAbbr + '</span><span class="year">' + y + '</span></div>' +
      '<div class="blog-card' + (disabled ? '' : ' clickable') + '"' + (disabled ? '' : ' onclick="location.href=\'' + href + '\'"') + '>' +
      '<h3>' + esc(post.title) + '</h3>' +
      '<div class="card-date-alt">' + dateLabel + '</div>' +
      '<p>' + esc(post.summary) + '</p>' +
      '<div class="card-tags">' + post.tags.map(function(t){return '<span>' + esc(t) + '</span>'}).join('') + '</div></div>'
    container.appendChild(entry)
  })
  document.getElementById('cntBlog').textContent = blogPosts.filter(function(p){return p.file && !p.disabled}).length
  observeReveals(container)
}

/* ---------- 人生清单 ---------- */
var CAT_LABEL = {do:'想做', buy:'想买', other:'其他'}
var STATUS_LABEL = {plan:'计划中', doing:'进行中', done:'已完成'}
var STATUS_ORDER = {doing:0, plan:1, done:2}
var lifeItems = (window.LIFE_ITEMS || []).map(function(it, i){
  return {
    id: it.id || ('l' + i),
    title: it.title || '',
    cat: CAT_LABEL[it.cat] ? it.cat : 'do',
    status: STATUS_LABEL[it.status] ? it.status : 'plan',
    cost: (it.cost === 0 || it.cost) ? Number(it.cost) : null,
    due: it.due || '',
    note: it.note || '',
    link: it.link || ''
  }
})
var lifeFilter = {cat:'all', status:'all'}

function fmtCost(n){
  if(n === null || n === undefined || n === '' || isNaN(n)) return ''
  return '¥' + Number(n).toLocaleString('zh-CN')
}
function sortedItems(){
  return lifeItems.slice().sort(function(a, b){
    var s = (STATUS_ORDER[a.status] || 0) - (STATUS_ORDER[b.status] || 0)
    if(s !== 0) return s
    if(a.due && b.due) return a.due < b.due ? -1 : (a.due > b.due ? 1 : 0)
    if(a.due) return -1
    if(b.due) return 1
    return 0
  })
}
function renderLifeStats(){
  var total = lifeItems.length
  var done = lifeItems.filter(function(i){return i.status === 'done'}).length
  var doN = lifeItems.filter(function(i){return i.cat === 'do'}).length
  var buyN = lifeItems.filter(function(i){return i.cat === 'buy'}).length
  var allCost = lifeItems.reduce(function(s, i){return s + (i.cost || 0)}, 0)
  var leftCost = lifeItems.filter(function(i){return i.status !== 'done'}).reduce(function(s, i){return s + (i.cost || 0)}, 0)

  document.getElementById('lifeStats').innerHTML =
    '<div class="stat"><div class="k">想做</div><div class="v">' + doN + '<em>项</em></div></div>' +
    '<div class="stat"><div class="k">想买</div><div class="v">' + buyN + '<em>项</em></div></div>' +
    '<div class="stat"><div class="k">预计总花费</div><div class="v">' + (allCost ? fmtCost(allCost) : '待定') + '</div></div>' +
    '<div class="stat"><div class="k">完成</div><div class="v">' + done + '<em>/ ' + total + ' 项</em></div></div>'

  var pct = total ? Math.round(done / total * 100) : 0
  document.getElementById('barPct').textContent = pct + '%'
  document.getElementById('barLabel').textContent = '完成进度 · 已完成 ' + done + ' 项，待花 ' + (leftCost ? fmtCost(leftCost) : '¥0')
  document.getElementById('barFill').style.width = pct + '%'
  document.getElementById('cntLife').textContent = total
}
function renderLifeGrid(){
  var grid = document.getElementById('lifeGrid')
  var list = sortedItems().filter(function(i){
    if(lifeFilter.cat !== 'all' && i.cat !== lifeFilter.cat) return false
    if(lifeFilter.status !== 'all' && i.status !== lifeFilter.status) return false
    return true
  })
  if(!lifeItems.length){
    grid.innerHTML = '<div class="empty">清单还是空的 —— 去 <a href="life-editor.html">管理清单</a> 添加第一件事</div>'
    document.getElementById('lifeFoot').innerHTML = ''
    return
  }
  if(!list.length){
    grid.innerHTML = '<div class="empty">这个筛选下没有条目</div>'
    document.getElementById('lifeFoot').innerHTML = ''
    return
  }
  grid.innerHTML = list.map(function(i, idx){
    var cost = i.cost === null ? '<span class="lc-cost tbd">花费待定</span>' : '<span class="lc-cost">' + fmtCost(i.cost) + '</span>'
    var title = esc(i.title)
    if(i.link) title = '<a href="' + esc(i.link) + '" target="_blank" rel="noopener">' + title + '</a>'
    return '<div class="life-card s-' + i.status + (i.status === 'done' ? ' done' : '') + '" style="animation-delay:' + (idx * 45) + 'ms">' +
      '<div class="lc-top"><div class="lc-title">' + title + '</div>' + cost + '</div>' +
      '<div class="lc-meta"><span class="tag ' + i.cat + '">' + CAT_LABEL[i.cat] + '</span>' +
      '<span class="st st-' + i.status + '"><i></i>' + STATUS_LABEL[i.status] + '</span>' +
      (i.due ? '<span class="lc-due">' + esc(i.due) + ' 前</span>' : '') + '</div>' +
      (i.note ? '<div class="lc-note">' + esc(i.note) + '</div>' : '') +
      '</div>'
  }).join('')
  var leftCost = list.reduce(function(s, i){return s + (i.cost || 0)}, 0)
  var foot = '当前显示 ' + list.length + ' / ' + lifeItems.length + ' 项 · 合计 ' + (leftCost ? fmtCost(leftCost) : '待定')
  if(window.LIFE_META && window.LIFE_META.updated) foot += ' · 更新于 ' + String(window.LIFE_META.updated).slice(0, 10)
  document.getElementById('lifeFoot').innerHTML = '<span>' + foot + '</span>'
}
function bindLifeFilters(){
  var box = document.getElementById('lifeFilters')
  box.addEventListener('click', function(e){
    var btn = e.target.closest('.chip')
    if(!btn) return
    if(btn.dataset.cat){
      lifeFilter.cat = btn.dataset.cat
      box.querySelectorAll('[data-cat]').forEach(function(b){ b.classList.toggle('on', b === btn) })
    } else if(btn.dataset.status){
      lifeFilter.status = btn.dataset.status
      box.querySelectorAll('[data-status]').forEach(function(b){ b.classList.toggle('on', b === btn) })
    }
    renderLifeGrid()
  })
}

/* ---------- 板块切换 ---------- */
function showTab(name, push){
  var target = name === 'life' ? 'life' : 'blog'
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.dataset.tab === target) })
  document.getElementById('panel-blog').classList.toggle('on', target === 'blog')
  document.getElementById('panel-life').classList.toggle('on', target === 'life')
  if(target === 'blog') observeReveals(document.getElementById('panel-blog'))
  if(push !== false){
    try{
      history.replaceState(null, '', target === 'life' ? '#life' : location.pathname + location.search)
    }catch(err){}
  }
  try{ localStorage.setItem('blogTab', target) }catch(err){}
}
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){ showTab(t.dataset.tab) })
})

renderPosts()
renderLifeStats()
renderLifeGrid()
bindLifeFilters()

var initial = (location.hash === '#life') ? 'life' : 'blog'
if(location.hash !== '#life' && location.hash !== '#blog'){
  try{ initial = localStorage.getItem('blogTab') === 'life' ? 'life' : 'blog' }catch(err){}
}
showTab(initial, false)
</script>

<script>
;(function(){
  var glow=document.getElementById('cursorGlow');var mx=0,my=0,gx=0,gy=0
  document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY})
  ;(function a(){gx+=(mx-gx)*.02;gy+=(my-gy)*.02;glow.style.transform='translate('+(gx-450)+'px,'+(gy-450)+'px)';requestAnimationFrame(a)})()
  var fill=document.getElementById('progressFill')
  function update(){var s=window.scrollY;var d=document.documentElement.scrollHeight-window.innerHeight;fill.style.height=(d>0?Math.min(100,(s/d)*100):0)+'%'}
  window.addEventListener('scroll',update,{passive:true});update()
})()
</script>
