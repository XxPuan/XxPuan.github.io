# Site
title: XxPuan's Value
subtitle: '物联网 · 嵌入式 · 边缘AI'
description: '徐培轩的个人博客 - 技术记录与生活思考'
keywords: [STM32, 物联网, 边缘AI, 嵌入式, HarmonyOS]
author: 徐培轩 (Payne XU)
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://xxpuan.github.io
root: ''
permalink: :year/:month/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
post_asset_folder: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false

# Home page
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Date
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
per_page: 10
pagination_dir: page

# Theme
theme: xxpuan

# Deployment
deploy:
  type: ''
