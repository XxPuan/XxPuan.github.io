<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--p:#DAAF4B;--pl:#F0D060;--p-rgb:218,175,75;--bg:#08080E;--c15:#F0EEE8;--c13:#D4CCC0;--c12:#B8AFA0;--c10:#9A9080;--c8:#6B6358;--hh:80px;--da:#e7e7a9;--db:#e5e37e;--dc:#559155}
html{font-family:"HarmonyOS Sans","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c15);-webkit-font-smoothing:antialiased}
body{min-height:100vh;position:relative}
body::before{
  content:'';position:fixed;inset:0;
  pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 700px 700px at 18% 28%, color-mix(in srgb,var(--da) 38%,transparent), transparent 65%),
    radial-gradient(ellipse 600px 600px at 78% 18%, color-mix(in srgb,var(--db) 30%,transparent), transparent 65%),
    radial-gradient(ellipse 800px 800px at 45% 82%, color-mix(in srgb,var(--dc) 28%,transparent), transparent 65%);
}
body::after{
  content:'';position:fixed;inset:0;
  pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 400px 400px at 60% 40%, color-mix(in srgb,var(--da) 15%,transparent), transparent 60%),
    radial-gradient(ellipse 450px 450px at 30% 70%, color-mix(in srgb,var(--db) 12%,transparent), transparent 60%);
  animation:drifting 12s ease-in-out infinite alternate;
}
@keyframes drifting{
  0%{transform:translate(0,0)}
  33%{transform:translate(15px,-10px)}
  50%{transform:translate(-10px,15px)}
  100%{transform:translate(10px,-5px)}
}
a{color:inherit;text-decoration:none}
#hm{height:var(--hh)}
#h{position:fixed;top:0;left:0;z-index:100;width:100%;height:var(--hh);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.035);backdrop-filter:blur(22px)saturate(1.8)brightness(1.12);-webkit-backdrop-filter:blur(22px)saturate(1.8)brightness(1.12);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 0 1.5px 1px rgba(255,255,255,.06)inset,0 0 10px 4px rgba(255,255,255,.03)inset,0 4px 16px rgba(0,0,0,.08),0 8px 32px rgba(0,0,0,.05)}
#h::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(218,175,75,.25)25%,rgba(240,208,96,.4)50%,rgba(218,175,75,.25)75%,transparent 95%);opacity:.9}
#h::after{content:'';position:absolute;bottom:-1px;left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent,rgba(218,175,75,.12),transparent)}
#ht{font-size:16px;font-weight:500;color:var(--c15);display:flex;align-items:center}
#ht b{font-size:22px;font-weight:800;margin-right:2px}
main{max-width:800px;margin:0 auto;padding:7rem 2rem 5rem;position:relative;z-index:1}
article h1{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;margin-bottom:.3rem}
.pm{color:var(--c8);font-size:14px;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(255,255,255,.05)}
.pc{font-size:17px;color:var(--c12);line-height:2}
.pc p{margin-bottom:1.2rem}
.bk{display:inline-flex;align-items:center;gap:6px;color:var(--c10);font-size:14px;margin-bottom:2rem;transition:color .3s}
.bk:hover{color:var(--pl)}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:1.5rem 0}
.img-grid img{width:100%;height:auto;border-radius:8px;transition:transform .3s;cursor:pointer}
.img-grid img:hover{transform:scale(1.03)}
footer{padding:2rem;border-top:1px solid rgba(255,255,255,.04);text-align:center;color:var(--c8);font-size:13px}
.fb{position:fixed;bottom:2.5rem;right:2.5rem;z-index:99;display:inline-flex;align-items:center;gap:8px;padding:0.65rem 1.2rem 0.65rem 1rem;border-radius:999px;background:#fff;color:var(--p);font-size:0.9rem;font-weight:700;border:none;box-shadow:0 4px 20px rgba(218,175,75,.15);transition:all .3s}
.fb:hover{background:var(--pl);color:#fff;transform:translateY(-3px);box-shadow:0 8px 28px rgba(218,175,75,.25)}
@media(max-width:767px){#h{padding:0 1rem}main{padding:6rem 1.5rem 3rem}.img-grid{gap:4px}}
</style>
