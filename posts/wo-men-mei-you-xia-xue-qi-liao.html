<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我们没有下学期了 - XxPuan</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--p:#7C3AED;--pl:#A855F7;--bg:#08080E;--c15:#F1F1F6;--c13:#D4D4E0;--c12:#B8B8CC;--c10:#8888A0;--c8:#5A5A70;--hh:80px}
html{font-family:"HarmonyOS Sans","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c15);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:inherit;text-decoration:none}
#hm{height:var(--hh)}
#h{position:fixed;top:0;left:0;z-index:100;width:100%;height:var(--hh);padding:0 2rem;display:flex;align-items:center;background:rgba(8,8,14,.55);backdrop-filter:blur(24px)saturate(1.4);border-bottom:1px solid rgba(255,255,255,.04)}
#ht{font-size:16px;font-weight:500;color:var(--c15);display:flex;align-items:center}
#ht b{font-size:22px;font-weight:800;margin-right:2px}
main{max-width:800px;margin:0 auto;padding:7rem 2rem 5rem;position:relative;z-index:1}
article h1{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;margin-bottom:.3rem}
.pm{color:var(--c8);font-size:14px;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(255,255,255,.05)}
.pc{font-size:16px;color:var(--c12);line-height:2}
.pc p{margin-bottom:1.2rem}
.bk{display:inline-flex;align-items:center;gap:6px;color:var(--c10);font-size:14px;margin-bottom:2rem;transition:color .3s}
.bk:hover{color:var(--pl)}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:1.5rem 0}
.img-grid img{width:100%;height:auto;border-radius:8px;transition:transform .3s;cursor:pointer}
.img-grid img:hover{transform:scale(1.03)}
footer{padding:2rem;border-top:1px solid rgba(255,255,255,.04);text-align:center;color:var(--c8);font-size:13px}
.fb{position:fixed;bottom:2.5rem;right:2.5rem;z-index:99;display:inline-flex;align-items:center;gap:8px;padding:0.65rem 1.2rem 0.65rem 1rem;border-radius:999px;background:#fff;color:var(--p);font-size:0.9rem;font-weight:700;border:none;box-shadow:0 4px 20px rgba(124,58,237,.15);transition:all .3s}
.fb:hover{background:var(--pl);color:#fff;transform:translateY(-3px);box-shadow:0 8px 28px rgba(124,58,237,.25)}
@media(max-width:767px){#h{padding:0 1rem}main{padding:6rem 1.5rem 3rem}.img-grid{gap:4px}}
</style>
</head>
<body>
<div id="hm"></div>
<header id="h"><div id="ht"><b>XxPuan</b></div></header>
<main>
<a class="bk" href="../blog.html">[ 返回博客 ]</a>
<article>
<h1>我们没有下学期了</h1>
<div class="pm">2026-06-15</div>
<div class="pc">
<p>九宫格走起</p>
<div class="img-grid">

<img src="../assets/blog-images/pic2.jpg" alt="">
<img src="../assets/blog-images/pic3.jpg" alt="">
<img src="../assets/blog-images/pic4.jpg" alt="">

<img src="../assets/blog-images/pic7.jpg" alt="">
<img src="../assets/blog-images/pic8.jpg" alt="">
<img src="../assets/blog-images/pic9.jpg" alt="">
</div>
</div>
</article>
</main>
<a href="../index.html" class="fb">返回首页</a>
<footer>(c) 2026 XxPuan</footer>
</body>
</html>
