<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>逃离 - XxPuan</title>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{--p-rgb:218,175,75;--p:#DAAF4B;--pl:#F0D060;--da:#e7e7a9;--db:#e5e37e;--dc:#559155;--bg:#08080E;--c15:#F0EEE8;--c13:#D4CCC0;--c12:#B8AFA0;--c10:#9A9080;--c8:#6B6358;--hh:80px}
        html{font-family:"HarmonyOS Sans","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--c15);-webkit-font-smoothing:antialiased}
        body{min-height:100vh}
        a{color:inherit;text-decoration:none}
        #hm{height:var(--hh)}
        #h{position:fixed;top:0;left:0;z-index:100;width:100%;height:var(--hh);padding:0 2rem;display:flex;align-items:center;background:rgba(8,8,14,.55);backdrop-filter:blur(24px)saturate(1.4);border-bottom:1px solid rgba(255,255,255,.04)}
        #ht{font-size:16px;font-weight:500;color:var(--c15);display:flex;align-items:center}
        #ht b{font-size:22px;font-weight:800;margin-right:2px}
        main{max-width:800px;margin:0 auto;padding:7rem 2rem 5rem;position:relative;z-index:1}
        article h1{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;margin-bottom:.3rem}
        .pm{color:var(--c8);font-size:14px;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(255,255,255,.05)}
        .pc{font-size:16px;color:var(--c12);line-height:2}
        .pc h2{font-size:1.4rem;font-weight:700;color:var(--c15);margin:2.5rem 0 .8rem}
        .pc h3{font-size:1.2rem;font-weight:600;color:var(--c13);margin:2rem 0 .6rem}
        .pc p{margin-bottom:1.2rem}
        .pc a{color:var(--pl);border-bottom:1px solid rgba(218,175,75,.2)}
        .pc img{max-width:100%;border-radius:12px;margin:1.2rem 0}
        .pc blockquote{border-left:3px solid var(--p);padding:.8rem 1.2rem;margin:1.2rem 0;background:rgba(218,175,75,.04);border-radius:0 8px 8px 0}
        .pc pre{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:1rem;overflow-x:auto;margin:1.2rem 0}
        .pc code{font-size:14px;background:rgba(255,255,255,.04);padding:2px 6px;border-radius:4px;color:var(--pl)}
        .pc pre code{background:none;padding:0}
        .pc ul,.pc ol{padding-left:1.5rem;margin-bottom:1rem}
        .bk{display:inline-flex;align-items:center;gap:6px;color:var(--c10);font-size:14px;margin-bottom:2rem}
        .bk:hover{color:var(--pl)}
        .pc .img-grid{display:grid;gap:8px;margin:1.2rem 0}
        .pc .img-grid.cols-1{grid-template-columns:1fr}
        .pc .img-grid.cols-2{grid-template-columns:repeat(2,1fr)}
        .pc .img-grid.cols-3{grid-template-columns:repeat(3,1fr)}
        .pc .img-grid img{width:100%;height:auto;border-radius:8px;transition:transform .3s;cursor:pointer}
        .pc .img-grid img:hover{transform:scale(1.02)}
        footer{padding:2rem;border-top:1px solid rgba(255,255,255,.04);text-align:center;color:var(--c8);font-size:13px}
        @media(max-width:767px){#h{padding:0 1rem}main{padding:6rem 1.5rem 3rem}}
    </style>
</head>
<body>
<div id="hm"></div>
<header id="h"><div id="ht"><b>XxPuan</b></div></header>
<main>
    <a class="bk" href="../blog.html">[返回]</a>
    <article>
        <h1>逃离</h1>
        <div class="pm">2026-07-24 | #碎碎念</div>
        <div class="pc"><b>今天我和我妈告诉了我想趁着假期去上海玩一趟， 很可惜，我不久就收到了来自我爸的长篇消息。</b><div><b><br></b></div><div><b>我没什么想说的，淡淡的，无论是情绪还是表情。</b></div><div><b><br></b></div><div><b>加油吧小小轩，努力上岸，趁早逃离</b></div><div><b><br></b></div><div><b>答应我，加油，好吗？</b></div></div>
    </article>
</main>
<footer>(c) 2026 XxPuan</footer>
</body>
</html>
