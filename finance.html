<script>
// LightPillar — 背景光柱效果
(function(){
  if(typeof THREE==='undefined') return;
  var container = document.getElementById('lightPillarBg');
  if(!container) return;
  var W = window.innerWidth, H = window.innerHeight;
  var scene = new THREE.Scene();
  var camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  var renderer = new THREE.WebGLRenderer({antialias:false, alpha:true, powerPreference:'low-power', precision:'mediump', stencil:false, depth:false});
  renderer.setSize(W,H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
  container.appendChild(renderer.domElement);

  var parseC = function(h){var c=new THREE.Color(h);return new THREE.Vector3(c.r,c.g,c.b);};
  var pillarRotRad = 0;
  var waveSin = Math.sin(0.4), waveCos = Math.cos(0.4);

  var mat = new THREE.ShaderMaterial({
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}',
    fragmentShader:'precision mediump float;uniform float uTime;uniform vec2 uResolution;uniform vec3 uTopColor;uniform vec3 uBottomColor;uniform float uIntensity;uniform float uGlowAmount;uniform float uPillarWidth;uniform float uPillarHeight;uniform float uNoiseIntensity;uniform float uRotCos;uniform float uRotSin;uniform float uPillarRotCos;uniform float uPillarRotSin;uniform float uWaveSin;uniform float uWaveCos;varying vec2 vUv;const int MAX_ITER=40;const int WAVE_ITER=2;void main(){vec2 uv=(vUv*2.0-1.0)*vec2(uResolution.x/uResolution.y,1.0);uv=vec2(uPillarRotCos*uv.x-uPillarRotSin*uv.y,uPillarRotSin*uv.x+uPillarRotCos*uv.y);vec3 ro=vec3(0.0,0.0,-10.0);vec3 rd=normalize(vec3(uv,1.0));vec3 col=vec3(0.0);float t=0.1;for(int i=0;i<MAX_ITER;i++){vec3 p=ro+rd*t;p.xz=vec2(uRotCos*p.x-uRotSin*p.z,uRotSin*p.x+uRotCos*p.z);vec3 q=p;q.y=p.y*uPillarHeight+uTime;float freq=1.0;float amp=1.0;for(int j=0;j<WAVE_ITER;j++){q.xz=vec2(uWaveCos*q.x-uWaveSin*q.z,uWaveSin*q.x+uWaveCos*q.z);q+=cos(q.zxy*freq-uTime*float(j)*2.0)*amp;freq*=2.0;amp*=0.5;}float d=length(cos(q.xz))-0.2;float bound=length(p.xz)-uPillarWidth;float k=4.0;float h=max(k-abs(d-bound),0.0);d=max(d,bound)+h*h*0.0625/k;d=abs(d)*0.15+0.01;float grad=clamp((15.0-p.y)/30.0,0.0,1.0);col+=mix(uBottomColor,uTopColor,grad)/d;t+=d*1.2;if(t>50.0)break;}float wn=uPillarWidth/3.0;col=tanh(col*uGlowAmount/wn);col-=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)/15.0*uNoiseIntensity;gl_FragColor=vec4(col*uIntensity,1.0);}',
    uniforms:{
      uTime:{value:0}, uResolution:{value:new THREE.Vector2(W,H)},
      uTopColor:{value:parseC('#7C3AED')}, uBottomColor:{value:parseC('#A855F7')},
      uIntensity:{value:0.4}, uGlowAmount:{value:0.008}, uPillarWidth:{value:4.0},
      uPillarHeight:{value:0.5}, uNoiseIntensity:{value:0.4},
      uRotCos:{value:1.0}, uRotSin:{value:0.0},
      uPillarRotCos:{value:Math.cos(pillarRotRad)}, uPillarRotSin:{value:Math.sin(pillarRotRad)},
      uWaveSin:{value:waveSin}, uWaveCos:{value:waveCos}
    },
    transparent:true, depthWrite:false, depthTest:false
  });

  var mesh = new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat);
  scene.add(mesh);

  var time = 0;
  function animate(){
    if(!mat) return;
    time += 0.016 * 0.25;
    mat.uniforms.uTime.value = time;
    mat.uniforms.uRotCos.value = Math.cos(time * 0.3);
    mat.uniforms.uRotSin.value = Math.sin(time * 0.3);
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    if(resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      var nw = window.innerWidth, nh = window.innerHeight;
      renderer.setSize(nw, nh);
      mat.uniforms.uResolution.value.set(nw, nh);
    }, 150);
  });
})();

    var d=cloneObj(defaultStore);d._ver=DATA_VER;saveData();return d;
  }

  // K线数据：250个交易日真实随机游走
  var currentView = 'month';
  function generateCandles(){
    var base = store.klineBase;
    var all = [];
    store.records.in.forEach(function(r){all.push({amount:r.amount,name:r.name,time:r.time,type:'in'});});
    store.records.out.forEach(function(r){all.push({amount:r.amount,name:r.name,time:r.time,type:'out'});});
    all.sort(function(a,b){return a.time.localeCompare(b.time);});
    var candles=[],val=base;
    all.forEach(function(r){
      var o=val, ch=r.type==='in'?r.amount:-r.amount, c=o+ch;
      candles.push({d:r.time,o:+o.toFixed(2),c:+c.toFixed(2),h:+Math.max(o,c).toFixed(2),l:+Math.min(o,c).toFixed(2)});
      val=c;
    });
    return candles;
  }
  var rawDailyData = generateCandles();

  function aggOHLC(arr){
    return {d:arr[0].d+'~'+arr[arr.length-1].d, o:arr[0].o, c:arr[arr.length-1].c,
      h:Math.max.apply(null,arr.map(function(x){return x.h;})),
      l:Math.min.apply(null,arr.map(function(x){return x.l;}))};
  }

  function getViewData(view){
    var d = rawDailyData;
    if(view === 'day') return d.slice(-45);
    if(view === 'month'){
      var weeks = [], step = 5;
      for(var i = Math.max(0, d.length - 105); i < d.length; i += step)
        weeks.push(aggOHLC(d.slice(i, Math.min(i+step, d.length))));
      return weeks;
    }
    var months = [], curM = '', bucket = [];
    d.forEach(function(c){
      var m = c.d.slice(0,7);
      if(m !== curM){ if(bucket.length) months.push(aggOHLC(bucket)); curM = m; bucket = [c]; }
      else bucket.push(c);
    });
    if(bucket.length) months.push(aggOHLC(bucket));
    return months;
  }

  // 绘制K线
  function drawKLine(){
    try {
      var canvas=document.getElementById('klineCanvas');
      if(!canvas) return;
      var W=1002,H=556,dpr=window.devicePixelRatio||1;
      canvas.width=W*dpr; canvas.height=H*dpr;
      canvas.style.width=W+'px'; canvas.style.height=H+'px';
      var ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);

      var show = getViewData(currentView);
      var count = show.length;
      if(!count){ctx.fillStyle='rgba(255,255,255,.08)';ctx.font='14px HarmonyOS Sans';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('暂无交易记录',W/2,H/2);return;}

      var pad={l:30,r:6,t:6,b:14};
      var chartW=W-pad.l-pad.r, chartH=H-pad.t-pad.b;
      var gap=chartW/count;
      var candleW=Math.max(1,Math.min(gap*0.5,20));

      var maxH=-Infinity,minL=Infinity;
      show.forEach(function(k){if(k.h>maxH)maxH=k.h;if(k.l<minL)minL=k.l;});
      var range=maxH-minL||1;

      function yPos(v){return pad.t+chartH*(1-(v-minL)/range);}
      function xPos(i){return pad.l+gap*i+gap/2;}

      ctx.clearRect(0,0,W,H);

      // 网格
      ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=0.5;ctx.setLineDash([2,4]);
      for(var g=0;g<=3;g++){var gy=pad.t+chartH*g/3;ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(W-pad.r,gy);ctx.stroke();}
      ctx.setLineDash([]);

      // Y轴
      ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='7px HarmonyOS Sans,sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
      for(var yi=0;yi<=3;yi++){var yv=pad.t+chartH*yi/3;var yl=+(maxH-(maxH-minL)*yi/3).toFixed(1);ctx.fillText(yl.toFixed(1),pad.l-4,yv);}

      // 成本线
      var costY=yPos(costLine);
      if(costY>=pad.t&&costY<=pad.t+chartH){
        ctx.save();
        ctx.strokeStyle='rgba(240,208,96,.6)';ctx.lineWidth=1.5;ctx.setLineDash([6,5]);ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(pad.l,costY);ctx.lineTo(W-pad.r,costY);ctx.stroke();
        ctx.restore();
        var label='成本 '+costLine.toFixed(1);
        ctx.font='8px HarmonyOS Sans,sans-serif';
        var tw=ctx.measureText(label).width;
        var lx=pad.l+6, ly=costY-12, lw=tw+14, lh=18, lrr=Math.min(9,lh/2);
        ctx.fillStyle='rgba(240,208,96,.15)';ctx.strokeStyle='rgba(240,208,96,.3)';ctx.lineWidth=0.5;
        ctx.beginPath();
        ctx.moveTo(lx+lrr,ly);ctx.lineTo(lx+lw-lrr,ly);ctx.arcTo(lx+lw,ly,lx+lw,ly+lrr,lrr);
        ctx.lineTo(lx+lw,ly+lh-lrr);ctx.arcTo(lx+lw,ly+lh,lx+lw-lrr,ly+lh,lrr);
        ctx.lineTo(lx+lrr,ly+lh);ctx.arcTo(lx,ly+lh,lx,ly+lh-lrr,lrr);
        ctx.lineTo(lx,ly+lrr);ctx.arcTo(lx,ly,lx+lrr,ly,lrr);
        ctx.closePath();ctx.fill();ctx.stroke();
        ctx.fillStyle='rgba(240,208,96,.9)';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(label,lx+lw/2,ly+lh/2);
      }

      // X轴时间标签
      ctx.fillStyle='rgba(255,255,255,.2)';ctx.font='6px HarmonyOS Sans,sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
      var ticks = currentView==='year' ? [0,Math.floor(count/2),count-1] : [0,Math.floor(count/3),Math.floor(count*2/3),count-1];
      ticks.forEach(function(idx){
        var p = show[idx].d;
        if(p.indexOf('~')>0) p = p.split('~')[0];
        ctx.fillText(p.slice(5), xPos(idx), H-pad.b+3);
      });

      // 蜡烛
      show.forEach(function(k,i){
        var x=xPos(i);
        var isUp=k.c>=k.o;
        var col=isUp?'#EF4444':'#22D65E';
        var top=Math.max(k.o,k.c), bot=Math.min(k.o,k.c);
        var yTop=yPos(top), yBot=yPos(bot);
        var yHigh=yPos(k.h), yLow=yPos(k.l);
        var bw=Math.max(1,candleW);
        var bh=Math.max(1,yBot-yTop);
        var rr=Math.min(1,bw/2,bh/2);

        ctx.strokeStyle=col;ctx.lineWidth=0.5;
        ctx.beginPath();ctx.moveTo(x,yHigh);ctx.lineTo(x,yLow);ctx.stroke();

        ctx.fillStyle=col;
        var rx=x-bw/2, ry=yTop;
        ctx.beginPath();
        ctx.moveTo(rx+rr,ry);ctx.lineTo(rx+bw-rr,ry);
        ctx.arcTo(rx+bw,ry,rx+bw,ry+rr,rr);
        ctx.lineTo(rx+bw,ry+bh-rr);ctx.arcTo(rx+bw,ry+bh,rx+bw-rr,ry+bh,rr);
        ctx.lineTo(rx+rr,ry+bh);ctx.arcTo(rx,ry+bh,rx,ry+bh-rr,rr);
        ctx.lineTo(rx,ry+rr);ctx.arcTo(rx,ry,rx+rr,ry,rr);
        ctx.closePath();ctx.fill();
      });
    } catch(e) {
      console.error('K-line draw error:', e);
    }
  }

  // 动态波动曲线：4个卡片数值驱动独立形态
  function drawWaveOnCanvas(canvasId, val, offset, colors, baseVal){
    try{
      var canvas = document.getElementById(canvasId);
      if(!canvas) return;
      var W=180,H=54,dpr=window.devicePixelRatio||1;
      canvas.width=W*dpr; canvas.height=H*dpr;
      canvas.style.width=W+'px'; canvas.style.height=H+'px';
      var ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
      ctx.clearRect(0,0,W,H);

      var deviation = Math.abs(val - (baseVal || 0));
      var amp = Math.min(18, Math.max(0.5, deviation/20000));
      var shift = val > (baseVal||0) ? 4 : (val < (baseVal||0) ? -4 : 0);
      var pts = [];
      for(var i=0;i<24;i++){
        var x = (i/23)*172;
        var y = 27 + Math.sin(i*0.55 + offset*0.7)*amp*0.55
                  - Math.cos(i*0.3 + offset*0.4)*amp*0.35
                  + Math.sin(i*0.85 + offset*1.1)*amp*0.15 + shift;
        pts.push({x:x, y:y});
      }

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(var i=1;i<pts.length;i++){
        var xc = (pts[i-1].x+pts[i].x)/2;
        var yc = (pts[i-1].y+pts[i].y)/2;
        ctx.quadraticCurveTo(pts[i-1].x,pts[i-1].y, xc, yc);
      }
      ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);

      var grad = ctx.createLinearGradient(0,0,W,0);
      grad.addColorStop(0, colors[0]);
      grad.addColorStop(0.4, colors[1]);
      grad.addColorStop(0.7, colors[2]);
      grad.addColorStop(1, colors[3]);

      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.shadowColor = colors[4]; ctx.shadowBlur = 8;
      ctx.stroke(); ctx.shadowBlur = 0;

      var last = pts[pts.length-1];
      ctx.beginPath(); ctx.arc(last.x, last.y, 4, 0, Math.PI*2);
      ctx.strokeStyle = colors[3]; ctx.lineWidth = 2;
      ctx.shadowColor = colors[4]; ctx.shadowBlur = 10;
      ctx.stroke(); ctx.shadowBlur = 0;
    }catch(e){console.error('Wave draw error:', e);}
  }

  // === 从记录自动汇总 ===
  function calcTotalReturn(){
    var s=0; store.records.in.forEach(function(r){s+=r.amount;});
    store.records.out.forEach(function(r){s-=r.amount;});
    return s;
  }
  function calcDailyProfit(){
    var today = new Date().toISOString().slice(0,10);
    var s=0;
    store.records.in.forEach(function(r){if(r.time.slice(0,10)===today)s+=r.amount;});
    store.records.out.forEach(function(r){if(r.time.slice(0,10)===today)s-=r.amount;});
    return s;
  }
  function recalcFromRecords(){
    store.totalReturn = calcTotalReturn();
    store.dailyProfit = calcDailyProfit();
    store.dailyProfitPct = store.totalReturn!==0 ? store.dailyProfit/Math.abs(store.totalReturn)*100 : 0;
    store.periodReturnPct = store.principal>0 ? store.totalReturn/store.principal*100 : 0;
    saveData();
    refreshPage();
  }

    data.forEach(function(r,i){
      html += '<tr id="ar_'+mode+'_'+i+'"><td>¥'+r.amount.toFixed(2)+'</td><td>'+r.name+'</td><td>'+r.time+'</td>';
      html += '<td class="at-actions"><button class="at-btn at-btn-edit" data-mode="'+mode+'" data-idx="'+i+'">✎</button><button class="at-btn at-btn-del" data-mode="'+mode+'" data-idx="'+i+'">✕</button></td></tr>';
    });
    html += '</tbody></table>';
    html += '<button class="at-btn-add" id="afAddRecord" data-mode="'+mode+'">+ 添加'+label+'记录</button>';
    html += '<div class="admin-foot"><button class="af-btn af-btn-primary" id="afSaveRecords" data-mode="'+mode+'">保存记录</button></div>';
    adminBody.innerHTML = html;

    // 编辑行
    adminBody.querySelectorAll('.at-btn-edit').forEach(function(btn){
      btn.addEventListener('click', function(){
        var m = this.dataset.mode, idx = parseInt(this.dataset.idx);
        var rec = store.records[m][idx];
        var tr = document.getElementById('ar_'+m+'_'+idx);
        if(tr.classList.contains('editing')) return;
        tr.classList.add('editing');
        tr.innerHTML = '<td><input class="af-inline-input af-inline-s" id="ie_'+m+'_'+idx+'_amount" value="'+rec.amount.toFixed(2)+'"></td>' +
          '<td><input class="af-inline-input" id="ie_'+m+'_'+idx+'_name" value="'+rec.name.replace(/'/g,'&apos;')+'"></td>' +
          '<td><input class="af-inline-input af-inline-m" id="ie_'+m+'_'+idx+'_time" value="'+rec.time+'"></td>' +
          '<td class="at-actions"><button class="at-btn at-btn-edit" id="ie_ok_'+m+'_'+idx+'" style="background:rgba(34,214,94,.15);color:#22D65E">✓</button></td>';
        document.getElementById('ie_ok_'+m+'_'+idx).addEventListener('click', function(){
          var amt = parseFloat(document.getElementById('ie_'+m+'_'+idx+'_amount').value);
          if(isNaN(amt) || amt<=0){ alert('请输入有效金额'); return; }
          store.records[m][idx].amount = amt;
          store.records[m][idx].name = document.getElementById('ie_'+m+'_'+idx+'_name').value || rec.name;
          store.records[m][idx].time = document.getElementById('ie_'+m+'_'+idx+'_time').value || rec.time;
          recalcFromRecords();
          renderRecordTab(m);
        });
      });
    });
    // 删除行
    adminBody.querySelectorAll('.at-btn-del').forEach(function(btn){
      btn.addEventListener('click', function(){
        var m = this.dataset.mode, idx = parseInt(this.dataset.idx);
        if(!confirm('确定删除此记录？')) return;
        store.records[m].splice(idx, 1);
        recalcFromRecords();
        renderRecordTab(m);
      });
    });
    // 添加记录
    document.getElementById('afAddRecord').addEventListener('click', function(){
      var m = this.dataset.mode;
      store.records[m].push({amount:0,name:'新记录',time:new Date().toISOString().slice(0,16).replace('T',' ')});
      saveData();
      renderRecordTab(m);
      // 自动进入编辑模式
      var idx = store.records[m].length - 1;
      var btn = document.querySelector('[data-idx="'+idx+'"]');
      if(btn) btn.click();
    });
    // 批量保存
    document.getElementById('afSaveRecords').addEventListener('click', function(){
      recalcFromRecords();
      renderRecordTab(this.dataset.mode);
    });
  }

  // 自适应缩放
  function fitLayout(){
    var wrapper = document.getElementById('appWrapper');
    if(!wrapper) return;
    var sx = window.innerWidth / 1440;
    var sy = window.innerHeight / 1024;
    var s = Math.min(sx, sy);
    wrapper.style.transform = 'scale(' + s + ')';
  }
  fitLayout();
  window.addEventListener('resize', fitLayout);

  console.log('OK');
})();
</script>
</body>
</html>
