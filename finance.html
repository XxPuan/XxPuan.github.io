<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>理财 · XxPuan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'HarmonyOS Sans';src:url('assets/fonts/HarmonyOS_Sans_Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'HarmonyOS Sans';src:url('assets/fonts/HarmonyOS_Sans_Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'HarmonyOS Sans';src:url('assets/fonts/HarmonyOS_Sans_Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'HarmonyOS Sans';src:url('assets/fonts/HarmonyOS_Sans_Black.woff2') format('woff2');font-weight:800;font-display:swap}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--red:#ef4444;--green:#22c55e;--k-up:#fbbf24;--k-down:#ec4899}
html{font-family:'HarmonyOS Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

/* ===== 背景 ===== */
body{
  min-height:100vh;overflow-x:hidden;
  background:linear-gradient(135deg,#060814 0%,#13102a 50%,#1d1735 100%);
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 550px 550px at 15% 20%,rgba(255,255,255,.06),transparent 60%),
    radial-gradient(ellipse 400px 400px at 72% 12%,rgba(255,255,255,.04),transparent 60%),
    radial-gradient(ellipse 600px 600px at 40% 80%,rgba(255,255,255,.03),transparent 60%);
}
a{color:inherit;text-decoration:none}

/* ===== 固定玻璃页眉 ===== */
.gs{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;
  width:calc(100% - 32px);max-width:1392px;height:50px;
  border-radius:50px;display:flex;align-items:center;padding:0 22px;
  background:rgba(0,0,0,.25);
  backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 4px 24px rgba(0,0,0,.12);
}
.gs__content{width:100%;display:flex;align-items:center;justify-content:space-between}
.gs__title{display:flex;align-items:center;gap:5px}
.gs__title b{font-size:20px;font-weight:800;color:#fff}
.gs__title .s{font-size:14px;font-weight:500;color:rgba(255,255,255,.50);letter-spacing:.01em}
.gs__nav{display:flex;align-items:center;gap:16px}
.gs__nav-item{font-size:13px;font-weight:500;color:rgba(255,255,255,.6);letter-spacing:.04em;cursor:pointer;transition:color .25s;text-decoration:none}
.gs__nav-item:hover,.gs__nav-item.active{color:#fff}

/* ============================================================
   主布局 — CSS Grid，无绝对定位
   大屏（>1400px）等效 PS 坐标：
     左栏  1040px | 间隙 20px | 右栏 332px → 1392px
     左右各留 24px → 1440px
   ============================================================ */
.page-wrap{
  width:100%;max-width:1440px;
  margin:0 auto;
  padding:88px 24px 24px;
}

/* 两栏网格 */
.layout-grid{
  display:grid;
  grid-template-columns: 1fr 332px;
  gap:20px;
  align-items:start;
}

/* ----- 左栏（K线 + 数据卡） ----- */
.left-col{
  display:flex;flex-direction:column;
  gap:16px;
}

/* ----- 磨砂玻璃（暗调） ----- */
.glass{
  background:rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.05);
  border-radius:16px;
  backdrop-filter:blur(14px) saturate(1.2);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 6px 24px rgba(0,0,0,.12);
}

/* ===== 标题 K 线区 ===== */
.chart-area{
  position:relative;
  padding:0;
  display:flex;flex-direction:column;
  height:706px;
  background:rgba(255,255,255,.04);
}
/* --- 标题区（icon + 标签 + 金额 + 涨跌幅胶囊） --- */
.cta-wrap{
  padding:49px 22px 0 49px;
}
.cta-row1{
  display:flex;align-items:center;gap:12px;
  margin-bottom:32px;
}
.cta-icon{width:31px;height:31px;flex-shrink:0;display:block}
.cta-label{font-size:30px;font-weight:700;color:#fff;line-height:1.2}
.cta-row2{
  display:flex;align-items:center;gap:18px;
}
.cta-amount{font-size:52px;font-weight:400;color:#fff;letter-spacing:-.02em;line-height:1}
/* 涨跌幅胶囊 */
.change-badge{
  display:inline-flex;align-items:center;justify-content:center;
  gap:3px;
  min-width:79px;height:41px;
  padding:0 14px;
  border-radius:21px;
  font-size:14px;font-weight:600;color:#fff;
  background:rgba(255,255,255,.09);
  white-space:nowrap;
  margin-top:4px;
}
.period-group{
  position:absolute;
  left:863px;top:119px;
  display:flex;
  gap:23px;
}
.period-btn{
  width:41px;height:21px;
  padding:0;
  border-radius:11px;
  border:none;
  background:rgba(255,255,255,.1);
  color:rgba(255,255,255,.5);
  font-size:11px;font-weight:500;
  cursor:pointer;
  transition:all .2s;
  font-family:inherit;
  display:flex;align-items:center;justify-content:center;
}
.period-btn.active{color:#fff;background:rgba(255,255,255,.2)}
.period-btn:hover:not(.active){color:rgba(255,255,255,.8)}
.chart-wrap{flex:1;position:relative;min-height:0;margin:0 22px 20px 49px}
#chartCanvas{width:100%;height:100%;display:block;position:absolute;top:0;left:0}
.chart-tooltip{
  position:absolute;pointer-events:none;z-index:10;display:none;
  background:rgba(11,25,50,.95);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:10px 14px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:110px;
}
.chart-tooltip.show{display:block}
.chart-tooltip .tt-date{font-size:11px;color:rgba(255,255,255,.35);margin-bottom:3px}
.chart-tooltip .tt-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;line-height:1.6}
.chart-tooltip .tt-row .tt-label{color:rgba(255,255,255,.35)}
.chart-tooltip .tt-row .tt-val{font-weight:600}

/* ===== 四个数据卡 ===== */
.data-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:14px;
}
.data-card{
  padding:16px 18px;
  display:flex;flex-direction:column;justify-content:center;
  height:180px;
}
.data-card .card-label{font-size:12px;font-weight:500;color:rgba(255,255,255,.45);letter-spacing:.03em;margin-bottom:5px}
.data-card .card-value{font-size:26px;font-weight:700;color:#fff;letter-spacing:-.02em;margin-bottom:2px}
.data-card .card-sub{font-size:12px;font-weight:500;display:flex;align-items:center;gap:4px}
.data-card .card-sub.up{color:var(--red)}
.data-card .card-sub.down{color:var(--green)}
.data-card .card-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:30px;opacity:.10}

/* ===== 变动记录区 ===== */
.records-area{
  padding:18px 16px;
  display:flex;flex-direction:column;
  height:907px;
}
.records-title{font-size:15px;font-weight:600;color:#fff;margin-bottom:2px}
.records-subtitle{font-size:11px;color:rgba(255,255,255,.35);margin-bottom:12px;letter-spacing:.04em}
.records-list{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.records-list::-webkit-scrollbar{width:3px}
.records-list::-webkit-scrollbar-track{background:transparent}
.records-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
.record-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 11px;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.03);
  border-radius:10px;
  transition:background .2s;
}
.record-item:hover{background:rgba(255,255,255,.04)}
.record-item .ri-left{display:flex;flex-direction:column;gap:2px}
.record-item .ri-label{font-size:13px;font-weight:500;color:#fff}
.record-item .ri-desc{font-size:11px;color:rgba(255,255,255,.3)}
.record-item .ri-amount{font-size:14px;font-weight:600}
.record-item .ri-amount.in{color:var(--red)}
.record-item .ri-amount.out{color:var(--green)}
.record-item .ri-date{font-size:10px;color:rgba(255,255,255,.2);margin-top:1px}
.records-empty{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:rgba(255,255,255,.2);
  text-align:center;line-height:1.8;
}

/* ============================================================
   中屏（≤1024px）— 两栏变一栏
   ============================================================ */
@media screen and (max-width:1400px){
  .layout-grid{grid-template-columns:1fr}
  .chart-area{height:auto;min-height:380px}
  .cta-wrap{padding:28px 18px 0 28px}
  .cta-label{font-size:24px}
  .cta-amount{font-size:38px}
  .cta-row1{margin-bottom:22px}
  .period-group{left:auto;top:auto;position:relative;padding:14px 18px 6px 28px;gap:8px}
  .chart-wrap{margin:0 18px 18px 28px}
  .records-area{height:auto;max-height:440px}
  .records-list{max-height:350px}
  .data-grid{gap:12px}
  .data-card{height:110px}
}

/* ============================================================
   中窄屏（≤1024px）— 数据卡变2列
   ============================================================ */
@media screen and (max-width:1024px){
  .data-grid{grid-template-columns:1fr 1fr}
  .data-card{height:110px}
  .cta-label{font-size:22px}
  .cta-amount{font-size:32px}
}

/* ============================================================
   小屏（≤767px）
   ============================================================ */
@media screen and (max-width:767px){
  .gs{height:46px;padding:0 14px;width:calc(100% - 16px)}
  .gs__title b{font-size:16px}.gs__title .s{font-size:12px}
  .gs__nav{gap:10px}.gs__nav-item{font-size:11px}
  .page-wrap{padding:78px 12px 16px}
  .chart-area{min-height:280px}
  .cta-wrap{padding:20px 12px 0 20px}
  .cta-label{font-size:20px}
  .cta-amount{font-size:28px}
  .cta-row1{margin-bottom:16px}
  .cta-icon{width:24px;height:24px}
  .change-badge{min-width:68px;height:34px;font-size:12px;padding:0 10px}
  .period-group{left:auto;top:auto;position:relative;padding:10px 12px 4px 20px;gap:6px}
  .period-btn{width:36px;height:18px;border-radius:9px;font-size:10px}
  .chart-wrap{margin:0 12px 12px 20px}
  .data-grid{grid-template-columns:1fr 1fr;gap:10px}
  .data-card{height:96px;padding:12px 14px}
  .data-card .card-value{font-size:20px}
  .records-area{padding:14px;max-height:380px}
}
</style>
</head>
<body>

<!-- ===== 玻璃页眉导航 ===== -->
<div class="gs">
  <div class="gs__content">
    <div class="gs__title"><b>XxPuan</b><span class="s">'s Value</span></div>
    <nav class="gs__nav">
      <a href="status.html" class="gs__nav-item">事件</a>
      <a href="finance.html" class="gs__nav-item active">理财</a>
      <a href="index.html" class="gs__nav-item">返回主页</a>
    </nav>
  </div>
</div>

<!-- ===== 主布局 ===== -->
<div class="page-wrap">
  <div class="layout-grid">

    <!-- 左栏 -->
    <div class="left-col">

      <!-- K线区 -->
      <div class="chart-area glass">
        <div class="cta-wrap">
          <div class="cta-row1">
            <img class="cta-icon" src="assets/人民币4.png" alt="¥">
            <span class="cta-label">当前收益</span>
          </div>
          <div class="cta-row2">
            <span class="cta-amount"><span id="profitAmt">0.00</span></span>
            <span class="change-badge" id="changeBadge">▲ +0.00%</span>
          </div>
        </div>
        <div class="period-group" id="periodGroup">
          <button class="period-btn" data-p="year">年</button>
          <button class="period-btn" data-p="month">月</button>
          <button class="period-btn active" data-p="day">日</button>
        </div>
        <div class="chart-wrap" id="chartWrap">
          <canvas id="chartCanvas"></canvas>
          <div class="chart-tooltip" id="chartTooltip"></div>
        </div>
      </div>

      <!-- 四个数据卡 -->
      <div class="data-grid">
        <div class="data-card glass">
          <div style="position:relative;flex:1;display:flex;flex-direction:column;justify-content:center">
            <div style="position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:30px;opacity:.10;pointer-events:none">💰</div>
            <div class="card-label">总资产</div>
            <div class="card-value" id="totalAsset">¥0.00</div>
            <div class="card-sub" id="totalSub">—</div>
          </div>
        </div>
        <div class="data-card glass">
          <div style="position:relative;flex:1;display:flex;flex-direction:column;justify-content:center">
            <div style="position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:30px;opacity:.10;pointer-events:none">📈</div>
            <div class="card-label">累计收益</div>
            <div class="card-value" id="cumReturn">¥0.00</div>
            <div class="card-sub" id="cumSub">—</div>
          </div>
        </div>
        <div class="data-card glass">
          <div style="position:relative;flex:1;display:flex;flex-direction:column;justify-content:center">
            <div style="position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:30px;opacity:.10;pointer-events:none">📊</div>
            <div class="card-label">今日盈亏</div>
            <div class="card-value" id="todayPL">¥0.00</div>
            <div class="card-sub" id="todaySub">—</div>
          </div>
        </div>
        <div class="data-card glass">
          <div style="position:relative;flex:1;display:flex;flex-direction:column;justify-content:center">
            <div style="position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:30px;opacity:.10;pointer-events:none">🎯</div>
            <div class="card-label">年化收益率</div>
            <div class="card-value" id="annualRate">0.00%</div>
            <div class="card-sub" id="annualSub">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右栏：变动记录 -->
    <div class="records-area glass">
      <div class="records-title">变动记录</div>
      <div class="records-subtitle">RECENT TRANSACTIONS</div>
      <div class="records-list" id="recordsList">
        <div class="records-empty">暂无记录<br>添加存款或支出后自动显示</div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
'use strict'

var STORAGE_KEY='***'
var data={accounts:[],dailyIncome:{}}
var raw=localStorage.getItem(STORAGE_KEY)
if(raw){try{var d=JSON.parse(raw);if(d.accounts)data.accounts=d.accounts;if(d.dailyIncome)data.dailyIncome=d.dailyIncome}catch(e){}}

var currentPeriod='day'
var candleData=[]
var costLine=0
var chartMargin={top:20,bottom:26,left:50,right:10}

function calcCostLine(){
  var p=0,l=0
  data.accounts.forEach(function(a){
    if(a.type==='deposit')p+=Number(a.amount)||0
    else l+=Number(a.amount)||0
  })
  costLine=p-l;return costLine
}

function fmtMoney(n,sign){
  if(n==null||isNaN(n))return sign?'¥0.00':'0.00'
  var s=n<0?'-':'',v=Math.abs(n)
  s+=sign?'¥':'';s+=v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})
  return s
}

function buildOHLC(period){
  calcCostLine()
  var dates=Object.keys(data.dailyIncome).sort()
  if(dates.length===0){
    dates=[];var now=new Date()
    for(var i=60;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);dates.push(d.toISOString().slice(0,10))}
  }
  var cum=costLine,rawData={}
  dates.forEach(function(ds){var inc=data.dailyIncome[ds];if(inc)cum+=Number(inc.amount)||0;rawData[ds]=cum})
  var groups={}
  dates.forEach(function(ds){
    var y=ds.slice(0,4),m=ds.slice(5,7)
    var key=period==='year'?y:period==='month'?y+'-'+m:ds
    if(!groups[key])groups[key]={dates:[],values:[]}
    groups[key].dates.push(ds);groups[key].values.push(rawData[ds])
  })
  candleData=[]
  Object.keys(groups).sort().forEach(function(k){
    var g=groups[k]
    candleData.push({date:k,label:fmtLabel(k,period),open:g.values[0],close:g.values[g.values.length-1],high:Math.max.apply(null,g.values),low:Math.min.apply(null,g.values)})
  })
  if(candleData.length===0)candleData.push({date:'today',label:'今日',open:costLine,close:costLine,high:costLine,low:costLine})
}

function fmtLabel(key,period){
  if(period==='year')return key.substring(2)+'年'
  if(period==='month'){var p=key.split('-');return parseInt(p[1])+'月'}
  return key.slice(5)
}

function updateCards(){
  var totalAsset=costLine
  candleData.forEach(function(c){totalAsset=c.close})
  document.getElementById('totalAsset').textContent=fmtMoney(totalAsset,true)
  var cumRet=totalAsset-costLine
  document.getElementById('cumReturn').textContent=(cumRet>=0?'+':'')+fmtMoney(cumRet,true)
  var cumEl=document.getElementById('cumSub')
  cumEl.textContent=cumRet>=0?'📈 累计盈利':'📉 累计亏损'
  cumEl.className='card-sub'+(cumRet>=0?' up':' down')
  if(candleData.length>1){
    var last=candleData[candleData.length-1],prev=candleData[candleData.length-2]
    var tPL=last.close-prev.close
    document.getElementById('todayPL').textContent=(tPL>=0?'+':'')+fmtMoney(tPL,true)
    var tEl=document.getElementById('todaySub')
    tEl.textContent=tPL>=0?'▲ 今日盈利':'▼ 今日亏损'
    tEl.className='card-sub'+(tPL>=0?' up':' down')
  }
  if(costLine>0){
    var totalRet=(totalAsset-costLine)/costLine
    document.getElementById('annualRate').textContent=(totalRet>=0?'+':'')+(totalRet*100).toFixed(2)+'%'
    var aEl=document.getElementById('annualSub')
    aEl.textContent='累计收益率'
    aEl.className='card-sub'+(totalRet>=0?' up':' down')
  }
}

function updateRecords(){
  var list=document.getElementById('recordsList')
  var items=data.accounts.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date)}).slice(0,20)
  if(items.length===0){
    list.innerHTML='<div class="records-empty">暂无记录<br>添加存款或支出后自动显示</div>'
    return
  }
  list.innerHTML=items.map(function(a){
    var isIn=a.type==='deposit'
    return '<div class="record-item"><div class="ri-left"><span class="ri-label">'+(isIn?'存款':'支出')+'</span><span class="ri-desc">'+(a.note||(isIn?'资金存入':'资金取出'))+'</span><span class="ri-date">'+(a.date?a.date.slice(5):'--')+'</span></div><span class="ri-amount '+(isIn?'in':'out')+'">'+(isIn?'+':'')+fmtMoney(Number(a.amount)||0,true)+'</span></div>'
  }).join('')
}

function updateHeader(){
  if(candleData.length===0)return
  var last=candleData[candleData.length-1],prev=candleData.length>1?candleData[candleData.length-2]:null
  document.getElementById('profitAmt').textContent=fmtMoney(last.close,false)
  var change=0
  if(prev&&prev.close!==0)change=(last.close-prev.close)/Math.abs(prev.close)*100
  var badge=document.getElementById('changeBadge')
  var isUp=change>=0
  badge.className='change-badge '+(isUp?'up':'down')
  badge.innerHTML=(isUp?'▲ +':'▼ ')+Math.abs(change).toFixed(2)+'%'
}

function drawChart(){
  var wrap=document.getElementById('chartWrap')
  var canvas=document.getElementById('chartCanvas'),ctx=canvas.getContext('2d')
  var dpr=Math.min(devicePixelRatio||1,2)
  var rect=wrap.getBoundingClientRect()
  var W=rect.width,H=rect.height
  if(W<10||H<10)return
  canvas.width=W*dpr;canvas.height=H*dpr
  canvas.style.width=W+'px';canvas.style.height=H+'px'
  ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H)
  if(candleData.length===0)return
  var ml=chartMargin.left,mr=chartMargin.right,mt=chartMargin.top,mb=chartMargin.bottom
  var cw=W-ml-mr,ch=H-mt-mb
  if(cw<10||ch<10)return
  var minP=Infinity,maxP=-Infinity
  candleData.forEach(function(c){if(c.low<minP)minP=c.low;if(c.high>maxP)maxP=c.high})
  var range=maxP-minP;if(range===0)range=100;var pad=range*0.08;minP-=pad;maxP+=pad
  function pY(v){return mt+ch*(1-(v-minP)/(maxP-minP))}
  ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=0.5;ctx.setLineDash([3,4])
  for(var i=0;i<=4;i++){var y=mt+ch*i/4;ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(W-mr,y);ctx.stroke()}
  ctx.setLineDash([])
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='10px HarmonyOS Sans,sans-serif';ctx.textAlign='right'
  for(var i=0;i<=4;i++)ctx.fillText(fmtMoney(minP+(maxP-minP)*(1-i/4),true),ml-4,mt+ch*i/4+4)
  var cnt=candleData.length,sp=cw/cnt,w=Math.max(2,Math.min(sp*0.6,18))
  candleData.forEach(function(c,i){
    var cx=ml+sp*(i+0.5),oy=pY(c.open),cy=pY(c.close),hy=pY(c.high),ly=pY(c.low)
    var up=c.close>=c.open
    ctx.strokeStyle=up?'rgba(251,191,36,.55)':'rgba(236,72,153,.55)'
    ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,hy);ctx.lineTo(cx,ly);ctx.stroke()
    ctx.fillStyle=up?'rgba(251,191,36,.8)':'rgba(236,72,153,.8)'
    ctx.fillRect(cx-w/2,Math.min(oy,cy),Math.max(1.5,w),Math.max(1,Math.abs(cy-oy)))
  })
  if(costLine>=minP&&costLine<=maxP){
    var ly=pY(costLine)
    ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.setLineDash([5,4])
    ctx.beginPath();ctx.moveTo(ml,ly);ctx.lineTo(W-mr,ly);ctx.stroke()
    ctx.setLineDash([])
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.font='10px HarmonyOS Sans,sans-serif';ctx.textAlign='left'
    ctx.fillText('成本 '+fmtMoney(costLine,true),ml+4,ly-4)
  }
  var maxL=Math.min(cnt,Math.max(2,Math.floor(W/60))),st=Math.max(1,Math.floor(cnt/maxL))
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='9px HarmonyOS Sans,sans-serif';ctx.textAlign='center'
  for(var i=0;i<cnt;i+=st)ctx.fillText(candleData[i].label,ml+sp*(i+0.5),H-mb+12)
  var tt=document.getElementById('chartTooltip')
  wrap.onmousemove=function(e){
    var r=wrap.getBoundingClientRect(),mx=e.clientX-r.left
    var idx=Math.round((mx-ml)/sp-0.5)
    if(idx<0||idx>=cnt){tt.classList.remove('show');return}
    var c=candleData[idx]
    tt.innerHTML='<div class="tt-date">'+c.label+'</div><div class="tt-row"><span class="tt-label">开</span><span class="tt-val">'+fmtMoney(c.open,true)+'</span></div><div class="tt-row"><span class="tt-label">高</span><span class="tt-val">'+fmtMoney(c.high,true)+'</span></div><div class="tt-row"><span class="tt-label">低</span><span class="tt-val">'+fmtMoney(c.low,true)+'</span></div><div class="tt-row"><span class="tt-label">收</span><span class="tt-val">'+fmtMoney(c.close,true)+'</span></div><div class="tt-row" style="border-top:1px solid rgba(255,255,255,.06);padding-top:2px;margin-top:2px"><span class="tt-label">成本</span><span class="tt-val">'+fmtMoney(costLine,true)+'</span></div>'
    tt.classList.add('show')
    var tx=e.clientX-r.left+14,ty=e.clientY-r.top-10
    if(tx+140>W)tx=e.clientX-r.left-150
    if(ty<0)ty=10;if(ty+120>H)ty=H-130
    tt.style.left=tx+'px';tt.style.top=ty+'px'
  }
  wrap.onmouseleave=function(){tt.classList.remove('show')}
  wrap.addEventListener('touchstart',function(){tt.classList.remove('show')},{passive:true})
}

document.getElementById('periodGroup').addEventListener('click',function(e){
  var btn=e.target.closest('.period-btn')
  if(!btn)return
  document.querySelectorAll('.period-btn').forEach(function(b){b.classList.remove('active')})
  btn.classList.add('active')
  currentPeriod=btn.dataset.p
  buildOHLC(currentPeriod);updateHeader();updateCards();drawChart()
})

buildOHLC(currentPeriod);updateHeader();updateCards();updateRecords();drawChart()
var rt
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(drawChart,100)})
document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(drawChart,200)})
})()
</script>
</body>
