*{margin:0;padding:0;box-sizing:border-box}

  --glass:rgba(255,255,255,.04);

  --neon-blue:#3b82f6;--neon-green:#00e5a0;
  --up:#ff3366;--down:#00e5a0;
  --glow-cyan:rgba(0,245,255,.35);--glow-magenta:rgba(255,45,149,.30);
  --glow-purple:rgba(168,85,247,.30);
}
html,body{width:100vw;height:100vh;overflow:hidden;margin:0;font-family:'HarmonyOS Sans',-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',sans-serif;-webkit-font-smoothing:antialiased;background:#05060f;color:var(--text-primary)}
#appWrapper{position:absolute;top:0;left:0;width:1440px;height:1024px;transform-origin:top left}

/* === 动态AI艺术背景 === */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#bgCanvas canvas{width:100%;height:100%;display:block}

/* === 梦幻渐变背景层 === */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 900px 900px at 15% 20%,rgba(0,200,255,.18),transparent 60%),
    radial-gradient(ellipse 800px 800px at 85% 15%,rgba(255,40,130,.15),transparent 60%),
    radial-gradient(ellipse 1000px 1000px at 50% 90%,rgba(140,80,255,.12),transparent 60%),
    radial-gradient(ellipse 600px 600px at 30% 55%,rgba(0,229,160,.10),transparent 55%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 500px 500px at 70% 40%,rgba(0,245,255,.08),transparent 50%),
    radial-gradient(ellipse 550px 550px at 20% 75%,rgba(255,45,149,.07),transparent 50%),
    radial-gradient(ellipse 450px 450px at 60% 80%,rgba(168,85,247,.06),transparent 50%);
  animation:auroraDrift 18s ease-in-out infinite alternate;
}
@keyframes auroraDrift{
  0%{transform:translate(0,0) scale(1)}
  25%{transform:translate(20px,-10px) scale(1.02)}
  50%{transform:translate(-15px,15px) scale(0.98)}
  75%{transform:translate(10px,-5px) scale(1.01)}
  100%{transform:translate(-8px,8px) scale(1)}
}

/* === 荧光粒子背景 === */
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(60px);animation:orbFloat 12s ease-in-out infinite alternate}
.bg-orb-1{width:500px;height:500px;top:-120px;left:-80px;background:radial-gradient(circle,rgba(0,200,255,.22),transparent 65%);animation-duration:14s}
.bg-orb-2{width:450px;height:450px;bottom:-100px;right:-60px;background:radial-gradient(circle,rgba(255,40,130,.18),transparent 65%);animation-duration:16s;animation-delay:-3s}
.bg-orb-3{width:400px;height:400px;top:35%;left:45%;background:radial-gradient(circle,rgba(140,80,255,.16),transparent 65%);animation-duration:20s;animation-delay:-7s}
@keyframes orbFloat{
  0%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30px,-20px) scale(1.1)}
  66%{transform:translate(-20px,25px) scale(0.95)}
  100%{transform:translate(15px,-10px) scale(1.05)}
}

#lightPillarBg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.35}
#cursorGlow{position:fixed;top:0;left:0;width:600px;height:600px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(0,245,255,.06),rgba(168,85,247,.03) 40%,transparent 70%);transform:translate(-50%,-50%);transition:opacity .3s}

/* === iOS 液态玻璃卡片 === */
.glass-card{
  position:absolute;
  background:linear-gradient(135deg,rgba(255,255,255,.02) 0%,rgba(255,255,255,.005) 50%,rgba(255,255,255,.01) 100%);
  backdrop-filter:blur(10px) saturate(1.2) brightness(1.01);
  -webkit-backdrop-filter:blur(10px) saturate(1.2) brightness(1.01);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:
    0 4px 20px rgba(0,0,0,.15),
    0 0 0 0.5px rgba(255,255,255,.04) inset;
  z-index:2;overflow:hidden;
  transition:box-shadow .4s ease,border-color .4s ease;
}
.glass-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08) 30%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.08) 70%,transparent);
  z-index:1;
}
.glass-card::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.015),transparent 35%);
}
.glass-card:hover{
  border-color:rgba(255,255,255,.10);
  box-shadow:
    0 8px 32px rgba(0,0,0,.18),
    0 0 0 0.5px rgba(255,255,255,.06) inset,

}

/* ===== 管理按钮 - 荧光齿轮 ===== */

<body>
<div id="bgCanvas"></div>
<div id="lightPillarBg"></div>

(function(){
  if(typeof THREE==='undefined') return;
  var container = document.getElementById('lightPillarBg');
  if(!container) return;
  var W = window.innerWidth, H = window.innerHeight;
  var scene = new THREE.Scene();
  var camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  var renderer = new THREE.WebGLRenderer({antialias:false, alpha:true, powerPreference:'low-power', precision:'mediump', stencil:false, depth:false});
  renderer.setSize(W,H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
  container.appendChild(renderer.domElement);

  var parseC = function(h){var c=new THREE.Color(h);return new THREE.Vector3(c.r,c.g,c.b);};
  var pillarRotRad = 0;
  var waveSin = Math.sin(0.4), waveCos = Math.cos(0.4);

  var mat = new THREE.ShaderMaterial({
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}',
    fragmentShader:'precision mediump float;uniform float uTime;uniform vec2 uResolution;uniform vec3 uTopColor;uniform vec3 uBottomColor;uniform float uIntensity;uniform float uGlowAmount;uniform float uPillarWidth;uniform float uPillarHeight;uniform float uNoiseIntensity;uniform float uRotCos;uniform float uRotSin;uniform float uPillarRotCos;uniform float uPillarRotSin;uniform float uWaveSin;uniform float uWaveCos;varying vec2 vUv;const int MAX_ITER=40;const int WAVE_ITER=2;void main(){vec2 uv=(vUv*2.0-1.0)*vec2(uResolution.x/uResolution.y,1.0);uv=vec2(uPillarRotCos*uv.x-uPillarRotSin*uv.y,uPillarRotSin*uv.x+uPillarRotCos*uv.y);vec3 ro=vec3(0.0,0.0,-10.0);vec3 rd=normalize(vec3(uv,1.0));vec3 col=vec3(0.0);float t=0.1;for(int i=0;i<MAX_ITER;i++){vec3 p=ro+rd*t;p.yz=vec2(uRotCos*p.y-uRotSin*p.z,uRotSin*p.y+uRotCos*p.z);vec3 q=p;q.x=p.x*uPillarHeight+uTime;float freq=1.0;float amp=1.0;for(int j=0;j<WAVE_ITER;j++){q.yz=vec2(uWaveCos*q.y-uWaveSin*q.z,uWaveSin*q.y+uWaveCos*q.z);q+=cos(q.xyz*freq-uTime*float(j)*2.0)*amp;freq*=2.0;amp*=0.5;}float d=length(cos(q.yz))-0.2;float bound=length(p.yz)-uPillarWidth;float k=4.0;float h=max(k-abs(d-bound),0.0);d=max(d,bound)+h*h*0.0625/k;d=abs(d)*0.15+0.01;float grad=clamp((15.0-p.x)/30.0,0.0,1.0);col+=mix(uBottomColor,uTopColor,grad)/d;t+=d*1.2;if(t>50.0)break;}float wn=uPillarWidth/3.0;col=tanh(col*uGlowAmount/wn);col-=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)/15.0*uNoiseIntensity;gl_FragColor=vec4(col*uIntensity,1.0);}',
    uniforms:{
      uTime:{value:0}, uResolution:{value:new THREE.Vector2(W,H)},
      uTopColor:{value:parseC('#00f5ff')}, uBottomColor:{value:parseC('#a855f7')},
      uIntensity:{value:0.3}, uGlowAmount:{value:0.006}, uPillarWidth:{value:2.8},
      uPillarHeight:{value:0.5}, uNoiseIntensity:{value:0.4},
      uRotCos:{value:1.0}, uRotSin:{value:0.0},
      uPillarRotCos:{value:Math.cos(pillarRotRad)}, uPillarRotSin:{value:Math.sin(pillarRotRad)},
      uWaveSin:{value:waveSin}, uWaveCos:{value:waveCos}
    },
    transparent:true, depthWrite:false, depthTest:false
  });

  var mesh = new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat);
  scene.add(mesh);

  var time = 0;
  function animate(){
    if(!mat) return;
    time += 0.016 * 0.25;
    mat.uniforms.uTime.value = time;
    mat.uniforms.uRotCos.value = Math.cos(time * 0.3);
    mat.uniforms.uRotSin.value = Math.sin(time * 0.3);
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    if(resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      var nw = window.innerWidth, nh = window.innerHeight;
      renderer.setSize(nw, nh);
      mat.uniforms.uResolution.value.set(nw, nh);
    }, 150);
  });
})();

// === AI艺术风格动态背景 ===
(function(){
  var container = document.getElementById('bgCanvas');
  if(!container) return;
  var canvas = document.createElement('canvas');
  container.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  var W, H, dpr;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // 星云色块
  var nebulae = [
    {x:0.12,y:0.18,r:0.5,color:[0,200,255],speed:0.06,phase:0},
    {x:0.82,y:0.12,r:0.45,color:[255,40,130],speed:0.05,phase:2},
    {x:0.48,y:0.88,r:0.55,color:[140,80,255],speed:0.04,phase:4},
    {x:0.28,y:0.45,r:0.4,color:[0,229,160],speed:0.055,phase:1.5},
    {x:0.72,y:0.55,r:0.35,color:[255,180,0],speed:0.035,phase:3},
    {x:0.08,y:0.72,r:0.38,color:[80,100,255],speed:0.07,phase:5},
    {x:0.92,y:0.78,r:0.3,color:[255,80,200],speed:0.045,phase:0.8},
    {x:0.55,y:0.3,r:0.4,color:[0,245,255],speed:0.04,phase:2.5},
  ];

  // 粒子
  var particles = [];
  for(var i=0;i<120;i++){
    particles.push({
      x:Math.random(), y:Math.random(),
      r:Math.random()*2+0.5,
      vx:(Math.random()-0.5)*0.0004,
      vy:(Math.random()-0.5)*0.0003,
      alpha:Math.random()*0.6+0.2,
      color:Math.random()>0.6?[0,245,255]:(Math.random()>0.5?[168,85,247]:[255,45,149]),
      pulse:Math.random()*Math.PI*2
    });
  }

  // 连线粒子对
  var linePairs = [];
  for(var i=0;i<30;i++){
    linePairs.push({
      x1:Math.random(), y1:Math.random(),
      x2:Math.random(), y2:Math.random(),
      vx1:(Math.random()-0.5)*0.0002, vy1:(Math.random()-0.5)*0.00015,
      vx2:(Math.random()-0.5)*0.0002, vy2:(Math.random()-0.5)*0.00015,
      alpha:Math.random()*0.15+0.05,
      color:Math.random()>0.5?[0,245,255]:[168,85,247]
    });
  }

  // 网格点
  var gridSpacing = 80;

  var time = 0;
  function draw(){
    time += 0.006;
    ctx.clearRect(0,0,W,H);

    // 底色 - 更有层次的渐变
    var bgGrad = ctx.createRadialGradient(W*0.25, H*0.35, 0, W*0.5, H*0.5, Math.max(W,H)*0.9);
    bgGrad.addColorStop(0,'#111540');
    bgGrad.addColorStop(0.3,'#0d1035');
    bgGrad.addColorStop(0.6,'#0a0d2a');
    bgGrad.addColorStop(1,'#060818');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0,0,W,H);

    // 大面积彩色底晕
    var baseGlow1 = ctx.createRadialGradient(W*0.1, H*0.3, 0, W*0.1, H*0.3, W*0.5);
    baseGlow1.addColorStop(0,'rgba(0,180,255,0.22)');
    baseGlow1.addColorStop(0.5,'rgba(0,120,255,0.10)');
    baseGlow1.addColorStop(1,'rgba(0,80,200,0)');
    ctx.fillStyle = baseGlow1;
    ctx.fillRect(0,0,W,H);

    var baseGlow2 = ctx.createRadialGradient(W*0.85, H*0.2, 0, W*0.85, H*0.2, W*0.45);
    baseGlow2.addColorStop(0,'rgba(255,40,130,0.18)');
    baseGlow2.addColorStop(0.5,'rgba(200,20,100,0.08)');
    baseGlow2.addColorStop(1,'rgba(150,10,80,0)');
    ctx.fillStyle = baseGlow2;
    ctx.fillRect(0,0,W,H);

    var baseGlow3 = ctx.createRadialGradient(W*0.5, H*0.9, 0, W*0.5, H*0.9, W*0.55);
    baseGlow3.addColorStop(0,'rgba(130,60,255,0.20)');
    baseGlow3.addColorStop(0.5,'rgba(100,40,200,0.10)');
    baseGlow3.addColorStop(1,'rgba(80,20,160,0)');
    ctx.fillStyle = baseGlow3;
    ctx.fillRect(0,0,W,H);

    // 大面积星云光晕
    nebulae.forEach(function(n){
      var nx = (n.x + Math.sin(time * n.speed + n.phase) * 0.06) * W;
      var ny = (n.y + Math.cos(time * n.speed * 0.7 + n.phase) * 0.05) * H;
      var nr = n.r * Math.min(W,H);
      var pulse = 0.8 + Math.sin(time * 1.2 + n.phase) * 0.2;
      var grad = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
      var c = n.color;
      grad.addColorStop(0, 'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.50*pulse)+')');
      grad.addColorStop(0.25, 'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.28*pulse)+')');
      grad.addColorStop(0.5, 'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.12*pulse)+')');
      grad.addColorStop(0.75, 'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.04*pulse)+')');
      grad.addColorStop(1, 'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,W,H);
    });

    // 极光带
    ctx.save();
    ctx.globalAlpha = 0.18;
    for(var band=0;band<3;band++){
      ctx.beginPath();
      var bandY = H * (0.3 + band * 0.25);
      ctx.moveTo(0, bandY);
      for(var bx=0;bx<=W;bx+=20){
        var by = bandY + Math.sin(bx*0.003 + time*2 + band*2)*40 + Math.cos(bx*0.005 + time*1.5)*20;
        ctx.lineTo(bx, by);
      }
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
      var bandColors = [[0,245,255],[168,85,247],[255,45,149]];
      var bc = bandColors[band];
      var bandGrad = ctx.createLinearGradient(0, bandY-60, 0, bandY+200);
      bandGrad.addColorStop(0, 'rgba('+bc[0]+','+bc[1]+','+bc[2]+',0.35)');
      bandGrad.addColorStop(0.5, 'rgba('+bc[0]+','+bc[1]+','+bc[2]+',0.12)');
      bandGrad.addColorStop(1, 'rgba('+bc[0]+','+bc[1]+','+bc[2]+',0)');
      ctx.fillStyle = bandGrad;
      ctx.fill();
    }
    ctx.restore();

    // 网格
    ctx.strokeStyle = 'rgba(0,245,255,0.08)';
    ctx.lineWidth = 0.5;
    var offsetX = (time * 6) % gridSpacing;
    var offsetY = (time * 3) % gridSpacing;
    for(var gx = -gridSpacing + offsetX; gx < W + gridSpacing; gx += gridSpacing){
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
    }
    for(var gy = -gridSpacing + offsetY; gy < H + gridSpacing; gy += gridSpacing){
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }

    // 网格交点
    ctx.fillStyle = 'rgba(0,245,255,0.20)';
    for(var gx2 = -gridSpacing + offsetX; gx2 < W + gridSpacing; gx2 += gridSpacing){
      for(var gy2 = -gridSpacing + offsetY; gy2 < H + gridSpacing; gy2 += gridSpacing){
        ctx.beginPath();
        ctx.arc(gx2, gy2, 1.5, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // 连线
    linePairs.forEach(function(lp){
      lp.x1 += lp.vx1; lp.y1 += lp.vy1;
      lp.x2 += lp.vx2; lp.y2 += lp.vy2;
      if(lp.x1<0)lp.x1=1;if(lp.x1>1)lp.x1=0;
      if(lp.y1<0)lp.y1=1;if(lp.y1>1)lp.y1=0;
      if(lp.x2<0)lp.x2=1;if(lp.x2>1)lp.x2=0;
      if(lp.y2<0)lp.y2=1;if(lp.y2>1)lp.y2=0;
      var c = lp.color;
      ctx.beginPath();
      ctx.moveTo(lp.x1*W, lp.y1*H);
      ctx.lineTo(lp.x2*W, lp.y2*H);
      ctx.strokeStyle = 'rgba('+c[0]+','+c[1]+','+c[2]+','+lp.alpha+')';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    });

    // 粒子
    particles.forEach(function(p){
      p.x += p.vx;
      p.y += p.vy;
      if(p.x < 0) p.x = 1; if(p.x > 1) p.x = 0;
      if(p.y < 0) p.y = 1; if(p.y > 1) p.y = 0;
      p.pulse += 0.025;
      var px = p.x * W, py = p.y * H;
      var pa = p.alpha * (0.5 + Math.sin(p.pulse) * 0.5);
      var c = p.color;
      // 光晕
      ctx.beginPath();
      ctx.arc(px, py, p.r * 5, 0, Math.PI*2);
      ctx.fillStyle = 'rgba('+c[0]+','+c[1]+','+c[2]+','+(pa*0.12)+')';
      ctx.fill();
      // 核心
      ctx.beginPath();
      ctx.arc(px, py, p.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba('+c[0]+','+c[1]+','+c[2]+','+pa+')';
      ctx.fill();
    });

    // 装饰弧线
    ctx.save();
    ctx.globalAlpha = 0.15;
    for(var arc=0;arc<4;arc++){
      var arcCx = W * (0.2 + arc * 0.2);
      var arcCy = H * (0.5 + Math.sin(time + arc) * 0.2);
      var arcR = 200 + arc * 80 + Math.sin(time * 0.8 + arc) * 30;
      ctx.beginPath();
      ctx.arc(arcCx, arcCy, arcR, -Math.PI*0.3 + time*0.1, Math.PI*0.5 + time*0.1);
      var arcColors = [[0,245,255],[168,85,247],[255,45,149],[0,229,160]];
      var ac = arcColors[arc];
      ctx.strokeStyle = 'rgba('+ac[0]+','+ac[1]+','+ac[2]+',0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();

    // 顶部流光
    var flowGrad = ctx.createLinearGradient(0, 0, W, 0);
    var flowOffset = Math.sin(time * 0.4) * 0.3 + 0.5;
    flowGrad.addColorStop(Math.max(0, flowOffset - 0.3), 'rgba(0,245,255,0)');
    flowGrad.addColorStop(Math.max(0, flowOffset - 0.1), 'rgba(0,245,255,0.06)');
    flowGrad.addColorStop(flowOffset, 'rgba(168,85,247,0.10)');
    flowGrad.addColorStop(Math.min(1, flowOffset + 0.1), 'rgba(255,45,149,0.06)');
    flowGrad.addColorStop(Math.min(1, flowOffset + 0.3), 'rgba(255,45,149,0)');
    ctx.fillStyle = flowGrad;
    ctx.fillRect(0, 0, W, 4);

    // 底部流光
    var flowGrad2 = ctx.createLinearGradient(0, H-4, W, H-4);
    var flowOffset2 = Math.cos(time * 0.35) * 0.3 + 0.5;
    flowGrad2.addColorStop(Math.max(0, flowOffset2 - 0.3), 'rgba(168,85,247,0)');
    flowGrad2.addColorStop(Math.max(0, flowOffset2 - 0.1), 'rgba(168,85,247,0.04)');
    flowGrad2.addColorStop(flowOffset2, 'rgba(0,245,255,0.08)');
    flowGrad2.addColorStop(Math.min(1, flowOffset2 + 0.1), 'rgba(0,229,160,0.04)');
    flowGrad2.addColorStop(Math.min(1, flowOffset2 + 0.3), 'rgba(0,229,160,0)');
    ctx.fillStyle = flowGrad2;
    ctx.fillRect(0, H-4, W, 4);

    requestAnimationFrame(draw);
  }
  draw();
})();

    }catch(e){}
    var d=cloneObj(defaultStore);d._ver=DATA_VER;saveData();return d;
  }

  // K线数据：250个交易日真实随机游走
  var currentView = 'month';
  function generateCandles(){
    var base = store.klineBase;
    var all = [];
    store.records.in.forEach(function(r){all.push({amount:r.amount,name:r.name,time:r.time,type:'in'});});
    store.records.out.forEach(function(r){all.push({amount:r.amount,name:r.name,time:r.time,type:'out'});});
    all.sort(function(a,b){return a.time.localeCompare(b.time);});
    var candles=[],val=base;
    all.forEach(function(r){
      var o=val, ch=r.type==='in'?r.amount:-r.amount, c=o+ch;
      candles.push({d:r.time,o:+o.toFixed(2),c:+c.toFixed(2),h:+Math.max(o,c).toFixed(2),l:+Math.min(o,c).toFixed(2)});
      val=c;
    });
    return candles;
  }
  var rawDailyData = generateCandles();

  function aggOHLC(arr){
    return {d:arr[0].d+'~'+arr[arr.length-1].d, o:arr[0].o, c:arr[arr.length-1].c,
      h:Math.max.apply(null,arr.map(function(x){return x.h;})),
      l:Math.min.apply(null,arr.map(function(x){return x.l;}))};
  }

  function getViewData(view){
    var d = rawDailyData;
    if(view === 'day') return d.slice(-45);
    // 月视图：按自然月(YYYY-MM)聚合
    if(view === 'month'){
      var months = [], curM = '', bucket = [];
      d.forEach(function(c){
        var m = c.d.slice(0,7);
        if(m !== curM){ if(bucket.length) months.push(aggOHLC(bucket)); curM = m; bucket = [c]; }
        else bucket.push(c);
      });
      if(bucket.length) months.push(aggOHLC(bucket));
      return months;
    }
    // 年视图：按自然年(YYYY)聚合
    var years = [], curY = '', bucket = [];
    d.forEach(function(c){
      var y = c.d.slice(0,4);
      if(y !== curY){ if(bucket.length) years.push(aggOHLC(bucket)); curY = y; bucket = [c]; }
      else bucket.push(c);
    });
    if(bucket.length) years.push(aggOHLC(bucket));
    return years;
  }

  // 绘制K线
  function drawKLine(){
    try {
      var canvas=document.getElementById('klineCanvas');
      if(!canvas) return;
      var W=1002,H=556,dpr=window.devicePixelRatio||1;
      canvas.width=W*dpr; canvas.height=H*dpr;
      canvas.style.width=W+'px'; canvas.style.height=H+'px';
      var ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);

      var show = getViewData(currentView);
      var count = show.length;
      if(!count){ctx.fillStyle='rgba(255,255,255,.08)';ctx.font='14px HarmonyOS Sans';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('暂无交易记录',W/2,H/2);return;}

      var pad={l:30,r:6,t:6,b:14};
      var chartW=W-pad.l-pad.r, chartH=H-pad.t-pad.b;
      var gap=chartW/count;
      var candleW=Math.max(1,Math.min(gap*0.5,20));

      var maxH=-Infinity,minL=Infinity;
      show.forEach(function(k){if(k.h>maxH)maxH=k.h;if(k.l<minL)minL=k.l;});
      var range=maxH-minL||1;

      function yPos(v){return pad.t+chartH*(1-(v-minL)/range);}
      function xPos(i){return pad.l+gap*i+gap/2;}

      ctx.clearRect(0,0,W,H);

      // 网格
      ctx.strokeStyle='rgba(0,245,255,.08)';ctx.lineWidth=0.5;ctx.setLineDash([2,4]);
      for(var g=0;g<=3;g++){var gy=pad.t+chartH*g/3;ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(W-pad.r,gy);ctx.stroke();}
      ctx.setLineDash([]);

      // Y轴
      ctx.fillStyle='rgba(0,245,255,.20)';ctx.font='7px HarmonyOS Sans,sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
      for(var yi=0;yi<=3;yi++){var yv=pad.t+chartH*yi/3;var yl=+(maxH-(maxH-minL)*yi/3).toFixed(1);ctx.fillText(yl.toFixed(1),pad.l-4,yv);}

      // 成本线
      var costY=yPos(costLine);
      if(costY>=pad.t&&costY<=pad.t+chartH){
        ctx.save();
        ctx.strokeStyle='rgba(255,215,0,.5)';ctx.lineWidth=1.5;ctx.setLineDash([6,5]);ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(pad.l,costY);ctx.lineTo(W-pad.r,costY);ctx.stroke();
        ctx.restore();
        var label='成本 '+costLine.toFixed(1);
        ctx.font='8px HarmonyOS Sans,sans-serif';
        var tw=ctx.measureText(label).width;
        var lx=pad.l+6, ly=costY-12, lw=tw+14, lh=18, lrr=Math.min(9,lh/2);
        ctx.fillStyle='rgba(255,215,0,.10)';ctx.strokeStyle='rgba(255,215,0,.25)';ctx.lineWidth=0.5;
        ctx.beginPath();
        ctx.moveTo(lx+lrr,ly);ctx.lineTo(lx+lw-lrr,ly);ctx.arcTo(lx+lw,ly,lx+lw,ly+lrr,lrr);
        ctx.lineTo(lx+lw,ly+lh-lrr);ctx.arcTo(lx+lw,ly+lh,lx+lw-lrr,ly+lh,lrr);
        ctx.lineTo(lx+lrr,ly+lh);ctx.arcTo(lx,ly+lh,lx,ly+lh-lrr,lrr);
        ctx.lineTo(lx,ly+lrr);ctx.arcTo(lx,ly,lx+lrr,ly,lrr);
        ctx.closePath();ctx.fill();ctx.stroke();
        ctx.fillStyle='rgba(255,215,0,.85)';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(label,lx+lw/2,ly+lh/2);
      }

      // X轴时间标签
      ctx.fillStyle='rgba(0,245,255,.18)';ctx.font='6px HarmonyOS Sans,sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
      var ticks = currentView==='year' ? [0,Math.floor(count/2),count-1] : [0,Math.floor(count/3),Math.floor(count*2/3),count-1];
      ticks.forEach(function(idx){
        var p = show[idx].d;
        if(p.indexOf('~')>0) p = p.split('~')[0];
        ctx.fillText(currentView==='year' ? p.slice(0,4) : p.slice(5), xPos(idx), H-pad.b+3);
      });

      // 蜡烛
      show.forEach(function(k,i){
        var x=xPos(i);
        var isUp=k.c>=k.o;
        var col=isUp?'#ff3366':'#00e5a0';
        var top=Math.max(k.o,k.c), bot=Math.min(k.o,k.c);
        var yTop=yPos(top), yBot=yPos(bot);
        var yHigh=yPos(k.h), yLow=yPos(k.l);
        var bw=Math.max(1,candleW);
        var bh=Math.max(1,yBot-yTop);
        var rr=Math.min(1,bw/2,bh/2);

        ctx.strokeStyle=col;ctx.lineWidth=0.5;
        ctx.beginPath();ctx.moveTo(x,yHigh);ctx.lineTo(x,yLow);ctx.stroke();

        ctx.fillStyle=col;
        var rx=x-bw/2, ry=yTop;
        ctx.beginPath();
        ctx.moveTo(rx+rr,ry);ctx.lineTo(rx+bw-rr,ry);
        ctx.arcTo(rx+bw,ry,rx+bw,ry+rr,rr);
        ctx.lineTo(rx+bw,ry+bh-rr);ctx.arcTo(rx+bw,ry+bh,rx+bw-rr,ry+bh,rr);
        ctx.lineTo(rx+rr,ry+bh);ctx.arcTo(rx,ry+bh,rx,ry+bh-rr,rr);
        ctx.lineTo(rx,ry+rr);ctx.arcTo(rx,ry,rx+rr,ry,rr);
        ctx.closePath();ctx.fill();
      });
    } catch(e) {
      console.error('K-line draw error:', e);
    }
  }

  // 视图切换（日→单日蜡烛，月→自然月聚合，年→自然年聚合）

  // 动态波动曲线：4个卡片数值驱动独立形态
  function drawWaveOnCanvas(canvasId, val, offset, colors, baseVal){
    try{
      var canvas = document.getElementById(canvasId);
      if(!canvas) return;
      var W=180,H=54,dpr=window.devicePixelRatio||1;
      canvas.width=W*dpr; canvas.height=H*dpr;
      canvas.style.width=W+'px'; canvas.style.height=H+'px';
      var ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
      ctx.clearRect(0,0,W,H);

      var deviation = Math.abs(val - (baseVal || 0));
      var amp = Math.min(18, Math.max(0.5, deviation/20000));
      var shift = val > (baseVal||0) ? 4 : (val < (baseVal||0) ? -4 : 0);
      var pts = [];
      for(var i=0;i<24;i++){
        var x = (i/23)*172;
        var y = 27 + Math.sin(i*0.55 + offset*0.7)*amp*0.55
                  - Math.cos(i*0.3 + offset*0.4)*amp*0.35
                  + Math.sin(i*0.85 + offset*1.1)*amp*0.15 + shift;
        pts.push({x:x, y:y});
      }

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(var i=1;i<pts.length;i++){
        var xc = (pts[i-1].x+pts[i].x)/2;
        var yc = (pts[i-1].y+pts[i].y)/2;
        ctx.quadraticCurveTo(pts[i-1].x,pts[i-1].y, xc, yc);
      }
      ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);

      var grad = ctx.createLinearGradient(0,0,W,0);
      grad.addColorStop(0, colors[0]);
      grad.addColorStop(0.4, colors[1]);
      grad.addColorStop(0.7, colors[2]);
      grad.addColorStop(1, colors[3]);

      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.shadowColor = colors[4]; ctx.shadowBlur = 8;
      ctx.stroke(); ctx.shadowBlur = 0;

      var last = pts[pts.length-1];
      ctx.beginPath(); ctx.arc(last.x, last.y, 4, 0, Math.PI*2);
      ctx.strokeStyle = colors[3]; ctx.lineWidth = 2;
      ctx.shadowColor = colors[4]; ctx.shadowBlur = 10;
      ctx.stroke(); ctx.shadowBlur = 0;
    }catch(e){console.error('Wave draw error:', e);}
  }

  // === 从记录自动汇总 ===
  function calcTotalReturn(){
    var s=0; store.records.in.forEach(function(r){s+=r.amount;});
    store.records.out.forEach(function(r){s-=r.amount;});
    return s;
  }
  function calcDailyProfit(){
    var today = new Date().toISOString().slice(0,10);
    var s=0;
    store.records.in.forEach(function(r){if(r.time.slice(0,10)===today)s+=r.amount;});
    store.records.out.forEach(function(r){if(r.time.slice(0,10)===today)s-=r.amount;});
    return s;
  }
  function recalcFromRecords(){
    store.totalReturn = calcTotalReturn();
    store.dailyProfit = calcDailyProfit();
    store.dailyProfitPct = store.totalReturn!==0 ? store.dailyProfit/Math.abs(store.totalReturn)*100 : 0;
    store.periodReturnPct = store.principal>0 ? store.totalReturn/store.principal*100 : 0;
    saveData();
    refreshPage();
  }

      try{document.execCommand('copy');}catch(e){}
      document.body.removeChild(ta);
      alert('✅ 当前数据已复制到剪贴板！\n\n📋 Git Push 同步步骤：\n1. 在 WebStorm 中打开 finance.html\n2. 找到 var defaultStore = { 这一行（约211行）\n3. 选中整个 defaultStore = {...} 部分（从 var defaultStore = 到 };）\n4. 粘贴替换为复制的 JSON\n5. 保存 → git add → commit → push\n\n或者直接告诉我，我帮你改文件😊');
    });
  }

  function renderRecordTab(mode){
    var label = mode==='in' ? '流入' : '流出';
    var data = store.records[mode];
    var html = '<table class="admin-table"><thead><tr><th style="width:80px">金额</th><th>名称</th><th style="width:140px">时间</th><th style="width:80px">操作</th></tr></thead><tbody>';
    data.forEach(function(r,i){
      html += '<tr id="ar_'+mode+'_'+i+'"><td>¥'+r.amount.toFixed(2)+'</td><td>'+r.name+'</td><td>'+r.time+'</td>';
      html += '<td class="at-actions"><button class="at-btn at-btn-edit" data-mode="'+mode+'" data-idx="'+i+'">✎</button><button class="at-btn at-btn-del" data-mode="'+mode+'" data-idx="'+i+'">✕</button></td></tr>';
    });
    html += '</tbody></table>';
    html += '<button class="at-btn-add" id="afAddRecord" data-mode="'+mode+'">+ 添加'+label+'记录</button>';
    html += '<div class="admin-foot"><button class="af-btn af-btn-primary" id="afSaveRecords" data-mode="'+mode+'">保存记录</button></div>';
    adminBody.innerHTML = html;

    // 编辑行
    adminBody.querySelectorAll('.at-btn-edit').forEach(function(btn){
      btn.addEventListener('click', function(){
        var m = this.dataset.mode, idx = parseInt(this.dataset.idx);
        var rec = store.records[m][idx];
        var tr = document.getElementById('ar_'+m+'_'+idx);
        if(tr.classList.contains('editing')) return;
        tr.classList.add('editing');
        tr.innerHTML = '<td><input class="af-inline-input af-inline-s" id="ie_'+m+'_'+idx+'_amount" value="'+rec.amount.toFixed(2)+'"></td>' +
          '<td><input class="af-inline-input" id="ie_'+m+'_'+idx+'_name" value="'+rec.name.replace(/'/g,'&apos;')+'"></td>' +
          '<td><input class="af-inline-input af-inline-m" id="ie_'+m+'_'+idx+'_time" value="'+rec.time+'"></td>' +
          '<td class="at-actions"><button class="at-btn at-btn-edit" id="ie_ok_'+m+'_'+idx+'" style="background:rgba(0,229,160,.12);color:var(--down);border:1px solid rgba(0,229,160,.18)">✓</button></td>';
        document.getElementById('ie_ok_'+m+'_'+idx).addEventListener('click', function(){
          var amt = parseFloat(document.getElementById('ie_'+m+'_'+idx+'_amount').value);
          if(isNaN(amt) || amt<=0){ alert('请输入有效金额'); return; }
          store.records[m][idx].amount = amt;
          store.records[m][idx].name = document.getElementById('ie_'+m+'_'+idx+'_name').value || rec.name;
          store.records[m][idx].time = document.getElementById('ie_'+m+'_'+idx+'_time').value || rec.time;
          recalcFromRecords();
          renderRecordTab(m);
        });
      });
    });
    // 删除行
    adminBody.querySelectorAll('.at-btn-del').forEach(function(btn){
      btn.addEventListener('click', function(){
        var m = this.dataset.mode, idx = parseInt(this.dataset.idx);
        if(!confirm('确定删除此记录？')) return;
        store.records[m].splice(idx, 1);
        recalcFromRecords();
        renderRecordTab(m);
      });
    });
    // 添加记录
    document.getElementById('afAddRecord').addEventListener('click', function(){
      var m = this.dataset.mode;
      store.records[m].push({amount:0,name:'新记录',time:new Date().toISOString().slice(0,16).replace('T',' ')});
      saveData();
      renderRecordTab(m);
      // 自动进入编辑模式
      var idx = store.records[m].length - 1;
      var btn = document.querySelector('[data-idx="'+idx+'"]');
      if(btn) btn.click();
    });
    // 批量保存
    document.getElementById('afSaveRecords').addEventListener('click', function(){
      recalcFromRecords();
      renderRecordTab(this.dataset.mode);
    });
  }

  // 自适应缩放
  function fitLayout(){
    var wrapper = document.getElementById('appWrapper');
    if(!wrapper) return;
    var sx = window.innerWidth / 1440;
    var sy = window.innerHeight / 1024;
    var s = Math.min(sx, sy);
    wrapper.style.transform = 'scale(' + s + ')';
  }
  fitLayout();
  window.addEventListener('resize', fitLayout);

  console.log('OK');
})();
</script>
</body>
</html>
